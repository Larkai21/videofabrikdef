services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: fabrica-postgres
    environment:
      POSTGRES_USER: fabrica
      POSTGRES_PASSWORD: fabrica
      POSTGRES_DB: fabrica
    ports:
      # 55432 en el host: el 5432 suele estar ocupado por otros proyectos
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fabrica -d fabrica']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: fabrica-redis
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      # 56379 en el host: el 6379 suele estar ocupado por otros proyectos
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
