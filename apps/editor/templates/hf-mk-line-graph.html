    <div
      id="mk-lg-root"
      data-composition-id="mk-line-graph"
      data-start="0"
      data-duration="7"
      data-width="1080"
      data-height="1920"

      <div id="mk-lg-labels"></div>

      ></div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters (inspector-style CONFIG) ----
           A minimal presentation line graph: 1–2 series draw on, dots pop, value labels
           ride their points, axes dimmer than labels (clear hierarchy). */
        var CONFIG = {
          // no scheme param — scheme-agnostic; re-skin via the --mk-* tokens
          series: [
            { name: "Renders", color: null /* accent */, values: [12, 26, 22, 38, 44, 58] },
            { name: "Projects", color: null /* blob-2 */, values: [8, 14, 18, 16, 28, 36] },
          ],
          xLabels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
          showValues: true,
          area: { x: 160, y: 240, w: 980, h: 500 }, // plot rectangle
          animationIn: true,
          animationOut: true,
        };

        var DUR = 7;
        var NS = "http://www.w3.org/2000/svg";
        var root = document.getElementById("mk-lg-root");
        var svg = document.getElementById("mk-lg-svg");
        var labels = document.getElementById("mk-lg-labels");
        var A = CONFIG.area;

        var accent = getComputedStyle(root).getPropertyValue("--mk-accent").trim();
        var blob2 = getComputedStyle(root).getPropertyValue("--mk-blob-2").trim();
        if (CONFIG.series[1] && !CONFIG.series[1].color) CONFIG.series[1].color = blob2;

        /* scale: 0..max(all values)*1.15 into the plot rect */
        var max = 0;
        CONFIG.series.forEach(function (s) {
          s.values.forEach(function (v) {
            if (v > max) max = v;
          });
        });
        max *= 1.15;
        var n = CONFIG.series[0].values.length;
        function px(i) {
          return A.x + (i / (n - 1)) * A.w;
        }
        function py(v) {
          return A.y + A.h - (v / max) * A.h;
        }

        /* baseline axis */
        var axis = document.createElementNS(NS, "line");
        axis.setAttribute("class", "mk-lg-axis");
        axis.setAttribute("x1", A.x - 20);
        axis.setAttribute("y1", A.y + A.h);
        axis.setAttribute("x2", A.x + A.w + 20);
        axis.setAttribute("y2", A.y + A.h);
        axis.id = "mk-lg-axis";
        svg.appendChild(axis);

        /* series paths, dots, value labels */
        var paths = [],
          dots = [],
          vals = [];
        CONFIG.series.forEach(function (s, si) {
          var color = s.color || accent;
          var d = s.values
            .map(function (v, i) {
              return (i === 0 ? "M" : "L") + px(i) + " " + py(v);
            })
            .join(" ");
          var path = document.createElementNS(NS, "path");
          path.setAttribute("class", "mk-lg-line");
          path.setAttribute("d", d);
          path.setAttribute("stroke", color);
          path.id = "mk-lg-path-" + si;
          svg.appendChild(path);
          paths.push(path);

          s.values.forEach(function (v, i) {
            var dot = document.createElementNS(NS, "circle");
            dot.setAttribute("class", "mk-lg-dot");
            dot.setAttribute("cx", px(i));
            dot.setAttribute("cy", py(v));
            dot.setAttribute("r", 9);
            dot.setAttribute("stroke", color);
            dot.id = "mk-lg-dot-" + si + "-" + i;
            svg.appendChild(dot);
            dots.push({ el: dot, si: si, i: i });

            if (CONFIG.showValues) {
              var val = document.createElement("div");
              /* Series after the first label downward. With every series
                 labelling upward the numbers collide wherever the lines run
                 close together. GAP clears the dot radius plus line stroke. */
              var below = si > 0;
              var GAP = 22;
              val.className = "mk-lg-value";
              val.id = "mk-lg-val-" + si + "-" + i;
              val.textContent = v;
              val.style.left = px(i) + "px";
              val.style.top = py(v) + (below ? GAP : -(GAP + 38)) + "px";
              labels.appendChild(val);
              vals.push({ el: val, si: si, i: i });
            }
          });
        });

        /* x labels + legend */
        CONFIG.xLabels.slice(0, n).forEach(function (t, i) {
          var xl = document.createElement("div");
          xl.className = "mk-lg-xlabel";
          xl.id = "mk-lg-xl-" + i;
          xl.textContent = t;
          xl.style.left = px(i) + "px";
          xl.style.top = A.y + A.h + 24 + "px";
          labels.appendChild(xl);
        });
        var legend = document.createElement("div");
        legend.className = "mk-lg-legend";
        legend.id = "mk-lg-legend";
        legend.style.left = A.x + "px";
        legend.style.top = A.y + A.h + 90 + "px";
        CONFIG.series.forEach(function (s) {
          var item = document.createElement("div");
          item.className = "mk-lg-legend-item";
          var dot = document.createElement("span");
          dot.className = "mk-lg-legend-dot";
          dot.style.background = s.color || accent;
          item.appendChild(dot);
          item.appendChild(document.createTextNode(s.name));
          legend.appendChild(item);
        });
        labels.appendChild(legend);

        var tl = gsap.timeline({ paused: true });
        var DRAW = 1.3;

        /* entrance: axis + x labels settle first */
        gsap.set([axis, legend], { opacity: 0 });
        tl.to(axis, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);
        CONFIG.xLabels.slice(0, n).forEach(function (t, i) {
          var xl = document.getElementById("mk-lg-xl-" + i);
          gsap.set(xl, { opacity: 0, y: 10 });
          tl.to(xl, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25 + i * 0.05);
        });

        /* draw each series, dots + values riding the draw front */
        CONFIG.series.forEach(function (s, si) {
          var t0 = (CONFIG.animationIn ? 0.5 : 0) + si * 0.35;
          var path = paths[si];
          var len = path.getTotalLength();
          gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(path, { strokeDashoffset: 0, duration: DRAW, ease: "power2.inOut" }, t0);

          s.values.forEach(function (v, i) {
            var dot = document.getElementById("mk-lg-dot-" + si + "-" + i);
            var td = t0 + (i / (n - 1)) * DRAW * 0.92;
            gsap.set(dot, { scale: 0, transformOrigin: "50% 50%" });
            tl.to(dot, { scale: 1, duration: 0.35, ease: "back.out(1.2)" }, td);
            if (CONFIG.showValues) {
              var val = document.getElementById("mk-lg-val-" + si + "-" + i);
              gsap.set(val, { opacity: 0, y: 8 });
              tl.to(val, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, td + 0.06);
            }
          });
        });

        tl.to(legend, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.3);

        /* exit + hard kill */
        if (CONFIG.animationOut) {
          tl.to([svg, labels], { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, DUR - 0.5);
        }
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["mk-line-graph"] = tl;
      })();
    </script>

<script>
(function () {

  var RANURAS = {"series":".mk-lg-legend-name","ejex":".mk-lg-xlabel"};
  var raiz = document.querySelector('[data-composition-id="' + ID + '"]');

  /* Maqueta a 1920x1080 y aquí el lienzo es 1080x1920: se escala al ancho y
     se centra. Es un APAÑO declarado, no una solución — la buena es rehacer
     la maqueta en vertical. config.encaje:false lo desactiva y
     config.escala lo fuerza.
     La medida sale de data-width/data-height y NO de offsetWidth: la raíz de
     varios bloques mide 0x0 —es un ancla para hijos posicionados, no una
     caja— y con la medida del DOM el encaje la mandaba a left:-420, fuera
     del cuadro. Fotograma transparente, cero errores, y el humo diciendo
     «no se mueve» porque no había nada que moviera. Por eso se envuelve en
     una caja del tamaño DECLARADO: así los hijos absolutos tienen un
     contenedor de verdad y la escala se aplica a algo con dimensiones. */
  var caja = null;
  function encaja(cfg) {
    if (!raiz || cfg.encaje === false) return;
    var w = +raiz.dataset.width || raiz.offsetWidth || 1920;
    var h = +raiz.dataset.height || raiz.offsetHeight || 1080;
    if (!caja) {
      caja = document.createElement('div');
      raiz.parentNode.insertBefore(caja, raiz);
      caja.appendChild(raiz);
    }
    caja.style.cssText = 'position:absolute;left:0;top:0;width:' + w
                       + 'px;height:' + h + 'px;transform-origin:0 0;';
    raiz.style.position = 'absolute';
    raiz.style.left = '0'; raiz.style.top = '0';
    raiz.style.width = w + 'px'; raiz.style.height = h + 'px';
    var k = cfg.escala || Math.min(1080 / w, 1920 / h);
    /* DÓNDE, y no solo cuánto. Centrado es lo razonable por defecto, pero un
       rótulo inferior centrado en un lienzo vertical queda en mitad de la
       cara; y §18 dice que la banda de abajo la pinta la app. zona mueve la
       caja ya escalada sin tocar la maqueta de dentro: arriba pega bajo la
       banda superior (230 px), abajo se apoya sobre la inferior (1459 px). */

    var y = (1920 - alto) / 2;
    if (cfg.zona === 'arriba') y = 230 + 40;
    else if (cfg.zona === 'abajo') y = 1459 - 40 - alto;
    caja.style.transform = 'translate(' + Math.round((1080 - w * k) / 2)
      + 'px,' + Math.round(y) + 'px) scale(' + k + ')';
  }

  /* LA CAJA DE TINTA, para colocar.py.
     Sin anclas() una capa es invisible para el colocador: no sabe cuánto
     ocupa ni dónde, así que no puede apartarla del rostro ni avisar de que
     cae bajo el caption de la app. Nuestras plantillas la declaran a mano

     puede saberlo, así que se MIDE: unión de los rectángulos visibles, ya en

     del encaje—, descartando los contenedores que cubren casi todo.
     Se llama después de seek, así que la caja es la del instante que se
     esté mirando y no la del reposo. */
  function tinta() {
    if (!raiz) return null;
    /* Dos pasadas. La primera descarta los contenedores que cubren casi todo
       —si no, la caja de cualquier plantilla sería el lienzo entero y el dato
       no diría nada—. Pero en las de dibujo a mano el contenido ES un <svg> a
       pantalla completa y sus <path> devuelven cajas de cero: con el filtro

       peor que ninguna, pero ninguna es peor que las dos. */
    function une(filtra) {
      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      var todos = raiz.querySelectorAll('*');
      for (var i = 0; i < todos.length; i++) {
        var e = todos[i], s = getComputedStyle(e);

            parseFloat(s.opacity) < 0.05) continue;
        var r = e.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) continue;
        if (filtra && r.width * r.height > 0.92 * 1080 * 1920) continue;
        if (r.left < x0) x0 = r.left;
        if (r.top < y0) y0 = r.top;
        if (r.right > x1) x1 = r.right;
        if (r.bottom > y1) y1 = r.bottom;

    if (!c) return null;
    var x0 = c[0], y0 = c[1], x1 = c[2], y1 = c[3];

    x1 = Math.min(1080, x1); y1 = Math.min(1920, y1);

     que la composición acaba. Aquí una capa vive dentro de su ventana y
     tiene que irse, y no es cosmética — es lo que humo_plantillas.js

     fotograma. Medido: x-post y macos-notification animan su entrada y dan
     tres capturas idénticas después.
