    <div
      id="yt-lcd-root"
      data-composition-id="yt-lcd-background"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <div id="yt-lcd-scan" data-layout-allow-overflow></div>
      <div id="yt-lcd-grid"></div>
      <div id="yt-lcd-grain"></div>
      <div id="yt-lcd-bow"></div>
      <div
        id="yt-lcd-drv"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters (inspector-style CONFIG) ---- */
        var CONFIG = {
          scheme: "light", // "light" | "dark" (light/dark toggle)
          title: "yt-lcd",
          subtitle: "background 01",
          fontSize: 230,
          subSize: 34,
          color: null, // null = scheme ink (AA). Cyan "#35c8d9" is dark-scheme only: 1.66:1 on light paper fails AA
          blur: 2.2, // resting text blur px (blur amount)
          prism: { enabled: true, offset: 3 }, // chromatic fringe (chromatic fringe)
          bow: { enabled: true, deg: 7 }, // perspective bow (safe CRT-bow variant)
          grid: { enabled: true }, // pixel grid (pixel grid)
          scanDrift: true, // slow scanline scroll for life
          animationIn: true,
          animationOut: true,
        };

        var DUR = 10;
        /* the yt- family improvement: in/out durations auto-scale to block
           length (animations adjust to the layer length) */
        function clamp(v, lo, hi) {
          return Math.min(hi, Math.max(lo, v));
        }
        var IN = clamp(DUR * 0.08, 0.3, 0.8);
        var OUT = clamp(DUR * 0.06, 0.25, 0.6);

        var root = document.getElementById("yt-lcd-root");
        var bow = document.getElementById("yt-lcd-bow");
        var grid = document.getElementById("yt-lcd-grid");
        var scan = document.getElementById("yt-lcd-scan");

        if (CONFIG.scheme === "dark") root.classList.add("yt-dark");
        if (!CONFIG.grid.enabled) grid.style.display = "none";

        var mainColor =
          CONFIG.color || (CONFIG.scheme === "dark" ? "var(--yt-ink-dark)" : "var(--yt-ink)");

        /* build a line: prism copies behind + main fill */
        function buildLine(text, size, idBase, prismOn) {
          var line = document.createElement("div");
          line.className = "yt-lcd-line";
          line.style.fontSize = size + "px";
          ["r", "b"].forEach(function (ch) {
            if (!CONFIG.prism.enabled || !prismOn) return;
            var c = document.createElement("div");
            c.className = "yt-lcd-copy " + ch;
            c.id = idBase + "-" + ch;
            c.textContent = text;
            line.appendChild(c);
          });
          var main = document.createElement("div");
          main.className = "yt-lcd-main";
          main.id = idBase + "-main";
          main.textContent = text;
          main.style.color = mainColor;
          line.appendChild(main);
          return line;
        }

        var titleLine = buildLine(CONFIG.title, CONFIG.fontSize, "yt-lcd-t", true);
        bow.appendChild(titleLine);
        if (CONFIG.subtitle) {
          var sub = buildLine(
            CONFIG.subtitle,
            CONFIG.subSize,
            "yt-lcd-s",
            false,
          ); /* fringe is title-only */
          sub.id = "yt-lcd-sub";
          bow.appendChild(sub);
        }
        if (CONFIG.bow.enabled) {
          bow.style.transform = "perspective(950px) rotateX(" + CONFIG.bow.deg + "deg)";
        }

        var O = CONFIG.prism.offset;
        var tl = gsap.timeline({ paused: true });

        /* entrance: board fades, text focuses in from heavy blur while the
           prism fringe settles from wide to resting offset */
        if (CONFIG.animationIn) {
          tl.from(root, { opacity: 0, duration: IN, ease: "power2.out" }, 0);
          gsap.set(bow, { opacity: 0, filter: "blur(16px)" });
          tl.to(bow, { opacity: 1, duration: IN * 1.4, ease: "power2.out" }, IN * 0.4);
          tl.to(
            bow,
            { filter: "blur(" + CONFIG.blur + "px)", duration: IN * 2.2, ease: "power2.out" },
            IN * 0.4,
          );
          if (CONFIG.prism.enabled) {
            gsap.set(".yt-lcd-copy.r", { x: -O * 4, opacity: 0.5 });
            gsap.set(".yt-lcd-copy.b", { x: O * 4, opacity: 0.5 });
            tl.to(
              ".yt-lcd-copy.r",
              { x: -O, opacity: 0.85, duration: IN * 2.2, ease: "power2.out" },
              IN * 0.4,
            );
            tl.to(
              ".yt-lcd-copy.b",
              { x: O, opacity: 0.85, duration: IN * 2.2, ease: "power2.out" },
              IN * 0.4,
            );
          }
        } else {
          gsap.set(bow, { filter: "blur(" + CONFIG.blur + "px)" });
          if (CONFIG.prism.enabled) {
            gsap.set(".yt-lcd-copy.r", { x: -O, opacity: 0.85 });
            gsap.set(".yt-lcd-copy.b", { x: O, opacity: 0.85 });
          }
        }

        /* ambient: slow scanline drift + a breath of prism wobble */
        if (CONFIG.scanDrift) {
          tl.to(
            scan,
            {
              y: 14,
              duration: 3.1,
              ease: "sine.inOut",
              yoyo: true,
              repeat: Math.max(1, Math.floor((DUR - 1) / 3.1) - 0),
            },
            0.5,
          );
        }
        if (CONFIG.prism.enabled) {
          tl.to(
            ".yt-lcd-copy.r",
            { x: -O - 1.2, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 2 },
            2.0,
          );
          tl.to(
            ".yt-lcd-copy.b",
            { x: O + 1.2, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 2 },
            2.0,
          );
        }

        /* exit + hard kill */
        if (CONFIG.animationOut) {
          tl.to(root, { opacity: 0, duration: OUT, ease: "power2.in" }, DUR - OUT - 0.05);
        }
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["yt-lcd-background"] = tl;
      })();
    </script>

<style>

     omitBackground no lo recorta y los PNG salen sin alfa — el compositor

     literalmente «self-preview scene» y es un degradado verde— y sobre
     nuestro metraje eso no es un fondo: es una mancha que tapa el plano.

  var RANURAS = {};

     se centra. Es un APAÑO declarado, no una solución — la buena es rehacer
     la maqueta en vertical. config.encaje:false lo desactiva y
     config.escala lo fuerza.
     La medida sale de data-width/data-height y NO de offsetWidth: la raíz de
     varios bloques mide 0x0 —es un ancla para hijos posicionados, no una
     caja— y con la medida del DOM el encaje la mandaba a left:-420, fuera
     del cuadro. Fotograma transparente, cero errores, y el humo diciendo
     «no se mueve» porque no había nada que moviera. Por eso se envuelve en
     una caja del tamaño DECLARADO: así los hijos absolutos tienen un
     contenedor de verdad y la escala se aplica a algo con dimensiones. */
  var caja = null;
  function encaja(cfg) {
    if (!raiz || cfg.encaje === false) return;
    var w = +raiz.dataset.width || raiz.offsetWidth || 1920;
    var h = +raiz.dataset.height || raiz.offsetHeight || 1080;
    if (!caja) {
      caja = document.createElement('div');
      raiz.parentNode.insertBefore(caja, raiz);
      caja.appendChild(raiz);
    }
    caja.style.cssText = 'position:absolute;left:0;top:0;width:' + w
                       + 'px;height:' + h + 'px;transform-origin:0 0;';
    raiz.style.position = 'absolute';
    raiz.style.left = '0'; raiz.style.top = '0';
    raiz.style.width = w + 'px'; raiz.style.height = h + 'px';
    var k = cfg.escala || Math.min(1080 / w, 1920 / h);
    /* DÓNDE, y no solo cuánto. Centrado es lo razonable por defecto, pero un
       rótulo inferior centrado en un lienzo vertical queda en mitad de la
       cara; y §18 dice que la banda de abajo la pinta la app. zona mueve la
       caja ya escalada sin tocar la maqueta de dentro: arriba pega bajo la
       banda superior (230 px), abajo se apoya sobre la inferior (1459 px). */
    var alto = h * k;
    var y = (1920 - alto) / 2;
    if (cfg.zona === 'arriba') y = 230 + 40;
    else if (cfg.zona === 'abajo') y = 1459 - 40 - alto;
    caja.style.transform = 'translate(' + Math.round((1080 - w * k) / 2)
      + 'px,' + Math.round(y) + 'px) scale(' + k + ')';

  /* LA CAJA DE TINTA, para colocar.py.
     Sin anclas() una capa es invisible para el colocador: no sabe cuánto
     ocupa ni dónde, así que no puede apartarla del rostro ni avisar de que
     cae bajo el caption de la app. Nuestras plantillas la declaran a mano

       peor que ninguna, pero ninguna es peor que las dos. */
    function une(filtra) {
      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      var todos = raiz.querySelectorAll('*');
      for (var i = 0; i < todos.length; i++) {

        if (s.display === 'none' || s.visibility === 'hidden' ||
            parseFloat(s.opacity) < 0.05) continue;
        var r = e.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) continue;
        if (filtra && r.width * r.height > 0.92 * 1080 * 1920) continue;

     tiene que irse, y no es cosmética — es lo que humo_plantillas.js
