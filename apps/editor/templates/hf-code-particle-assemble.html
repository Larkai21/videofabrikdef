    <script>
      // hf-code-anim-gl.js — WebGL code-animation engine for the "crazy" Code Animations blocks.
      //
      // Bridges the baked Shiki tokens (window.__TOKENS) into Three.js: the tokens are drawn once
      // to an offscreen 2D canvas (a CanvasTexture), which then drives a lit 3D slab, a dissolve
      // shader, or a GPU particle system. Determinism per the project contract:
      //   - render only via tl.eventCallback("onUpdate", …) + one initial render() — never rAF
      //   - all randomness from a seeded mulberry32 — never Math.random / Date.now
      //   - canvas drawn once after document.fonts.ready (final glyph metrics)
      //   - paused GSAP timeline registered on window.__timelines[id]; HF seeks it per frame
      //
      // Each block sets window.__BLOCK = { id, effect, seq, duration, seed } and includes this engine.
      (function () {
        "use strict";
        var T = window.__TOKENS || {};

        // ---- seeded PRNG (no Math.random) -----------------------------------------
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // ---- split a token state into lines of {content,color} --------------------
        function splitLines(state) {
          var lines = [[]];
          for (var i = 0; i < state.tokens.length; i++) {
            var t = state.tokens[i];
            if (t.content === "\n") {
              lines.push([]);
              continue;
            }
            lines[lines.length - 1].push(t);
          }
          while (lines.length && lines[lines.length - 1].length === 0) lines.pop();
          return lines;
        }

        // ---- THE BRIDGE: draw baked tokens to an offscreen 2D canvas ---------------
        // Returns { canvas, W, H, lines, lineH, padY, fontPx } so effects can sample it.
        function drawCodeToCanvas(state, opts) {
          opts = opts || {};
          var fontPx = opts.fontPx || 36;
          var lineH = opts.lineH || 54;
          var padX = opts.padX || 70;
          var padY = opts.padY || 60;
          var weight = opts.weight || 500;
          var font = weight + " " + fontPx + 'px "JetBrains Mono", monospace';

          var lines = splitLines(state);
          var measure = document.createElement("canvas").getContext("2d");
          measure.font = font;
          var maxW = 0;
          for (var i = 0; i < lines.length; i++) {
            var w = 0;
            for (var j = 0; j < lines[i].length; j++)
              w += measure.measureText(lines[i][j].content).width;
            if (w > maxW) maxW = w;
          }
          var W = Math.max(2, Math.ceil(maxW + padX * 2));
          var H = Math.max(2, Math.ceil(lines.length * lineH + padY * 2));

          var canvas = document.createElement("canvas");
          canvas.width = W;
          canvas.height = H;
          var ctx = canvas.getContext("2d");
          if (opts.transparent) {
            ctx.clearRect(0, 0, W, H);
          } else {
            ctx.fillStyle = opts.bg || "#0b0f17";
            ctx.fillRect(0, 0, W, H);
          }
          ctx.textBaseline = "top";
          ctx.font = font;
          for (var li = 0; li < lines.length; li++) {
            var x = padX;
            var y = padY + li * lineH;
            for (var k = 0; k < lines[li].length; k++) {
              var tok = lines[li][k];
              ctx.fillStyle = tok.color;
              ctx.fillText(tok.content, x, y);
              x += ctx.measureText(tok.content).width;
            }
          }
          return {
            canvas: canvas,
            W: W,
            H: H,
            lines: lines.length,
            lineH: lineH,
            padY: padY,
            fontPx: fontPx,
          };
        }

        function fxParticles(THREE, scene, camera, renderer, state, st, tl, dur, seed) {
          scene.background = new THREE.Color(0x05070b);
          var code = drawCodeToCanvas(state, {
            fontPx: 46,
            lineH: 70,
            padX: 70,
            padY: 64,
            weight: 700,
          });
          var cw = code.W;
          var ch = code.H;
          var data = code.canvas.getContext("2d").getImageData(0, 0, cw, ch).data;
          var rng = mulberry32(((seed || 1) * 2654435761) >>> 0);

          var worldW = 13.0;
          var worldH = worldW * (ch / cw);

          // sample glyph pixels (brighter than the dark bg) on a fixed grid
          var step = 2;
          var tx = [];
          var col = [];
          for (var y = 0; y < ch; y += step) {
            for (var x = 0; x < cw; x += step) {
              var idx = (y * cw + x) * 4;
              var r = data[idx];
              var g = data[idx + 1];
              var b = data[idx + 2];
              if (r + g + b < 120) continue; // skip background
              tx.push((x / cw - 0.5) * worldW, -(y / ch - 0.5) * worldH, 0);
              col.push(r / 255, g / 255, b / 255);
            }
          }
          var n = tx.length / 3;

          var positions = new Float32Array(n * 3);
          var aOrigin = new Float32Array(n * 3);
          var aTarget = new Float32Array(tx);
          var aColor = new Float32Array(col);
          var aDelay = new Float32Array(n);
          for (var i = 0; i < n; i++) {
            var sx = (rng() * 2 - 1) * worldW * 1.15;
            var sy = (rng() * 2 - 1) * worldH * 1.7;
            var sz = (rng() * 2 - 1) * 9.0 - 2.0;
            aOrigin[i * 3] = sx;
            aOrigin[i * 3 + 1] = sy;
            aOrigin[i * 3 + 2] = sz;
            positions[i * 3] = sx;
            positions[i * 3 + 1] = sy;
            positions[i * 3 + 2] = sz;
            aDelay[i] = rng();
          }

          var geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
          geo.setAttribute("aOrigin", new THREE.BufferAttribute(aOrigin, 3));
          geo.setAttribute("aTarget", new THREE.BufferAttribute(aTarget, 3));
          geo.setAttribute("aColor", new THREE.BufferAttribute(aColor, 3));
          geo.setAttribute("aDelay", new THREE.BufferAttribute(aDelay, 1));

          var uniforms = { uProgress: { value: 0 }, uSize: { value: 3.4 } };
          var mat = new THREE.ShaderMaterial({
            uniforms: uniforms,
            transparent: true,
            depthTest: false,
            depthWrite: false,
            blending: THREE.NormalBlending,
            vertexShader: [
              "attribute vec3 aOrigin; attribute vec3 aTarget; attribute vec3 aColor; attribute float aDelay;",
              "uniform float uProgress; uniform float uSize;",
              "varying vec3 vColor; varying float vP;",
              "void main(){",
              "  float span = 0.62;",
              "  float p = clamp((uProgress - aDelay*(1.0-span)) / span, 0.0, 1.0);",
              "  p = p*p*(3.0-2.0*p);",
              "  vec3 pos = mix(aOrigin, aTarget, p);",
              "  vec4 mv = modelViewMatrix * vec4(pos, 1.0);",
              "  gl_Position = projectionMatrix * mv;",
              "  gl_PointSize = uSize * (60.0 / -mv.z) * (0.45 + 0.55*p);",
              "  vColor = aColor; vP = p;",
              "}",
            ].join("\n"),
            fragmentShader: [
              "precision highp float;",
              "varying vec3 vColor; varying float vP;",
              "void main(){",
              "  vec2 d = gl_PointCoord - 0.5;",
              "  float r2 = dot(d, d);",
              "  if (r2 > 0.25) discard;",
              "  float a = smoothstep(0.25, 0.02, r2);",
              // brighter & whiter in flight, resolves to true color as it lands
              "  vec3 c = mix(vColor + vec3(0.32)*(1.0-vP), vColor, vP);",
              "  gl_FragColor = vec4(c, a * (0.7 + 0.3*vP));",
              "}",
            ].join("\n"),
          });

          var pts = new THREE.Points(geo, mat);
          scene.add(pts);

          camera.position.set(0, 0, 10);
          var vfov = (camera.fov * Math.PI) / 180;
          var sa = 1920 / 1080;
          var fitH = worldH / 2 / Math.tan(vfov / 2) / 0.78;
          var fitW = worldW / 2 / (Math.tan(vfov / 2) * sa) / 0.78;
          camera.position.z = Math.max(fitH, fitW);
          camera.lookAt(0, 0, 0);

          tl.to(uniforms.uProgress, { value: 1.0, duration: dur * 0.72, ease: "power2.out" }, 0);

          // uProgress is tweened by GSAP; the boot loop's render() draws once per frame.
          return function () {};
        }

        // ---- dispatch + boot ------------------------------------------------------
        function buildEffect(THREE, scene, camera, renderer, spec, st, tl) {
          var state = T[spec.seq].states[0];
          var dur = spec.duration;
          if (spec.effect === "particles")
            return fxParticles(THREE, scene, camera, renderer, state, st, tl, dur, spec.seed);
          return function () {};
        }

        // Free GPU resources (renderer, geometries, materials, textures) on page teardown.
        // One-shot renders exit per job so nothing leaks there; this guards long-lived
        // Studio/player sessions that reload. Fires only on unload — never during capture.
        function disposeGL(renderer, scene) {
          scene.traverse(function (o) {
            if (o.geometry && o.geometry.dispose) o.geometry.dispose();
            var mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
            mats.forEach(function (m) {
              if (m.map && m.map.dispose) m.map.dispose();
              if (
                m.uniforms &&
                m.uniforms.uTex &&
                m.uniforms.uTex.value &&
                m.uniforms.uTex.value.dispose
              ) {
                m.uniforms.uTex.value.dispose();
              }
              if (m.dispose) m.dispose();
            });
          });
          if (renderer.dispose) renderer.dispose();
        }

        function go() {
          var spec = window.__BLOCK;
          var root = document.getElementById("root");
          var glcanvas = document.getElementById("gl");
          var W = 1920;
          var H = 1080;
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          window.__timelines[spec.id] = tl; // register synchronously

          var THREE = window.THREE;
          var renderer = new THREE.WebGLRenderer({
            canvas: glcanvas,
            antialias: true,
            alpha: false,
            preserveDrawingBuffer: true,
          });
          renderer.setPixelRatio(1);
          renderer.setSize(W, H, false);
          var scene = new THREE.Scene();
          var camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 200);
          var st = {};

          document.fonts.ready.then(function () {
            var renderFn = buildEffect(THREE, scene, camera, renderer, spec, st, tl);
            function render() {
              renderFn();
              renderer.render(scene, camera);
            }
            tl.eventCallback("onUpdate", render);
            var dur = parseFloat(root.dataset.duration) || tl.duration();
            tl.to({}, { duration: dur }, 0); // pad to full composition length
            render(); // paint frame 0
            window.addEventListener("beforeunload", function () {
              disposeGL(renderer, scene);
            });
          });
        }

        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go);
        else go();
      })();
    </script>

<script>
(function () {

     config.escala lo fuerza.

     tiene que irse, y no es cosmética — es lo que humo_plantillas.js
     comprueba cuando muestrea tres instantes y exige que no sean el mismo
     fotograma. Medido: x-post y macos-notification animan su entrada y dan
     tres capturas idénticas después.
     Es una salida GENÉRICA —se va bajando y encogiendo un pelo— y por eso
     se puede apagar con config.salida:false cuando el bloque tenga la suya
     propia. Determinista: solo depende de t. */
  var SALIDA = 0.42;
  /* La duración del GESTO, medida al importar. La sustituye el importador;
     el valor de aquí es el de respaldo para quien abra el fichero suelto.
     Va en una variable y no en dos sitios a propósito: la salida tiene que
     caer dentro de la MISMA ventana que registra la plantilla, y cuando eran
     dos números —la declarada por la timeline y la registrada— la salida se
     programaba fuera del tramo que nadie llega a ver. */
  /* El copy que el plan pide, repartido por orden sobre las ranuras que
     declara TEXTOS. Lo que sobra se ignora; lo que falta se queda con lo que
     el bloque traía.
     Se aplica en CADA fotograma y no solo al montar, y no es por comodidad:
     varios bloques animan su propio texto —un contador que sube, un
     tecleado— así que su timeline reescribe el nodo en cada seek y el copy
     del plan duraba un fotograma. Medido: la tarjeta pedía «−12» y salía el
     «22» de la demo. */
  function copia(cfg) {
    for (var k in RANURAS) {
      if (!cfg || !cfg[k] || !cfg[k].length) continue;
      var nodos = document.querySelectorAll(RANURAS[k]);
      for (var i = 0; i < nodos.length && i < cfg[k].length; i++) {
        if (nodos[i].textContent !== cfg[k][i]) nodos[i].textContent = cfg[k][i];
      }
    }
  }

  var DUR = 1.20;   /* MEDIDO al importar */
  var vida = DUR;

  Engine.register({
    duration: DUR,
    /* Las ranuras se escriben LITERALES en los defaults, no con un
       Object.assign: lint_config.py lee ese bloque con una expresión regular
       —no ejecuta la plantilla— así que una clave calculada no existe para
       él y el plan que la usa aborta por «clave que la plantilla no lee».
       Las ranuras entran aquí porque lint_config.py --estricto
       comprueba que toda clave del plan la lea de verdad su plantilla: sin
       declararlas, pedir el copy por config es una clave muerta y el paso
       aborta. */
    defaults: { encaje: true, escala: null, zona: 'centro', salida: true,
                tema: 'carbon', cue: null, cueGain: null },
    setup: function (cfg) {
      encaja(cfg);
      vida = cfg.duration || DUR;
      copia(cfg);
      /* EL SONIDO: NINGUNO por defecto, y esto es una vuelta atrás.
         Se publicaba un «aparicion» genérico en cada bloque importado para
         que no entraran mudos. Sobre la pieza montada suena a lo que es: el
         mismo golpe blando en 126 sitios, puesto por una regla que no sabe
         qué está entrando. Un sonido que no significa nada es peor que el
         silencio, porque el oído lo cuenta igual.
         Quien sabe qué suena una capa es el guion —sfx en la capa— o la
         tabla del director para las plantillas que conoce. Con cue en la
         config se puede pedir uno a mano. */
      return { cues: (!cfg.sinSonido && cfg.cue)
                     ? [{ at: 0.04, sfx: cfg.cue, gain: cfg.cueGain || 0.5 }]
                     : [] };
    },
    anclas: function () { return tinta(); },
    /* El puente entero. Los dos motores hacen lo mismo —posicionar una
       animación en el segundo t, sin tocar el reloj del navegador—, así que
       no hay nada que traducir. */
    /* La salida va en la raíz y el encaje en la caja que la envuelve: dos
       transformaciones en dos nodos, para que no se pisen. */
    draw: function (t, cfg) {
      if (tl) tl.time(Math.max(0, Math.min(t, tl.duration())));
      copia(cfg);
      if (!raiz) return;
      if (cfg && cfg.salida !== false && vida > SALIDA) {
        var d = (t - (vida - SALIDA)) / SALIDA;
        if (d > 0) {
          var e = 1 - Math.min(1, d);
          e = e * e * (3 - 2 * e);              /* suavizado, sin rebote */
          raiz.style.opacity = e;
          raiz.style.transform = 'translateY(' + ((1 - e) * -26).toFixed(2)
                               + 'px) scale(' + (0.985 + 0.015 * e).toFixed(4) + ')';
          return;
        }
      }
      raiz.style.opacity = '';
      raiz.style.transform = '';
    }
  });
})();
</script>
