<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pasos / Flow</title>
<link rel="stylesheet" href="_tokens.css">
<style>
  .stage { position: absolute; inset: 0; }

  /* El bloque se posiciona por su borde superior y los pasos van absolutos
     dentro: sus alturas cambian con el reloj —el activo está desplegado y los
     demás plegados—, así que el flujo vertical de CSS no puede colocarlos.
     Se calcula en `draw`, que es donde se sabe qué paso está activo. */
  .flujo { position: absolute; left: var(--s-7); right: var(--s-7); }

  svg.riel { position: absolute; left: 0; top: 0; width: 100%; height: 1px;
             overflow: visible; pointer-events: none; }
  /* El raíl COMPLETO está siempre a la vista: es el mapa del proceso, y por
     eso un paso pendiente no es un hueco sino una estación fría. La traza de
     metal se dibuja encima conforme avanza. */
  /* `--rule` es el token correcto por semántica y el equivocado por
     contraste: sobre metraje oscuro cae a 1,3:1 y la vía deja de verse, o sea
     que el mapa del proceso —lo único que justifica dibujar los pasos
     pendientes— desaparece. `--ink-faint` al 55 % se lee sobre los dos temas
     y sigue siendo claramente más callado que la traza. */
  .via   { fill: none; stroke: var(--ink-faint); stroke-width: 2;
           stroke-linecap: round; opacity: 0.55; }
  .traza { fill: none; stroke-width: 4; stroke-linecap: round; }

  .paso {
    position: absolute; left: 0; right: 0;
    display: flex; align-items: flex-start; gap: var(--s-4);
  }

  /* ---------------- la estación ---------------- */
  /* 64 px de LAYOUT siempre, en los tres estados: la geometría del raíl se
     calcula con ese número y no puede depender de la animación. Lo que crece
     y encoge es un `transform`, que no toca la maquetación. */
  .nodo {
    position: relative; flex: none;
    width: 64px; height: 64px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--rule);
    will-change: transform;
    z-index: 2;
  }
  /* Dos rellenos apilados en vez de un `background` que cambia: el bronce no
     se puede interpolar con un color liso —un degradado y un `#RRGGBB` no son
     el mismo tipo de valor— y cruzarlos por opacidad sí. */
  .relleno { position: absolute; inset: -1px; border-radius: 50%; }
  .caliente { background-image: linear-gradient(var(--metal-ang),
              var(--metal-1) 0%, var(--metal-3) 42%,
              var(--metal-4) 68%, var(--metal-5) 100%); }
  .patina   { background: var(--accent-2); }

  .n {
    position: relative; z-index: 1;
    font-family: var(--mono);
    font-size: var(--t-sm);
    letter-spacing: var(--tr-caps);
    font-variant-numeric: tabular-nums;
    will-change: font-variation-settings, color;
  }

  /* ---------------- la ficha ---------------- */
  .caja { position: relative; flex: 1; padding: 0 var(--s-5);
          will-change: transform; }

  /* El cromo va en su propia capa para que su opacidad sea independiente del
     texto: si el fondo y el borde vivieran en `.caja`, atenuar la ficha
     plegada atenuaría también el título, y el título tiene que seguir
     legible —es la única parte del paso pendiente que se lee—. */
  .cromo {
    position: absolute; inset: -14px -12px -16px -18px;
    border-radius: var(--r-md);
    background: var(--surface);
    border: var(--hairline) solid var(--stroke);
    box-shadow: 0 16px 38px var(--sombra);
    isolation: isolate;
    overflow: hidden;
    will-change: opacity;
  }

  .titulo {
    position: relative; z-index: 1;
    min-height: 64px;                 /* centra el título contra la estación */
    display: flex; align-items: center;
    font-family: var(--display);
    font-size: var(--t-lg);
    letter-spacing: var(--tr-texto);
    line-height: 1.1;
    will-change: font-variation-settings, color;
  }

  /* Se pliega por ALTURA, no por opacidad: un texto transparente sigue
     ocupando su sitio y el raíl quedaría con tres estaciones separadas por el
     aire de un párrafo que no se ve. */
  .cuerpo { position: relative; z-index: 1; overflow: hidden;
            will-change: height; }
  .desc {
    padding-bottom: 2px;
    font-family: var(--subs);
    font-size: var(--t-sm);
    font-weight: var(--w-libro);
    color: var(--ink-soft);
    line-height: 1.35;
  }
  .meta {
    margin-top: var(--s-2); padding-bottom: var(--s-3);
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--mono);
    font-size: var(--t-xs);
    font-weight: var(--w-medio);
    letter-spacing: var(--tr-caps);
    color: var(--ink-soft);
  }
  /* Era `▸`, un glifo del sistema. Un triángulo de la fuente por defecto es la
     firma de que nadie dibujó nada; un filete de bronce de 2 px es un objeto
     de esta marca y cuesta lo mismo. */
  .meta i { display: block; width: 22px; height: 2px; flex: none;
            background-image: linear-gradient(var(--metal-ang),
              var(--metal-1), var(--metal-3) 55%, var(--metal-5)); }
</style>
</head>
<body>
<div class="stage">
  <div class="flujo" id="flujo">
    <svg class="riel" id="riel">
      <path class="via"   id="via"></path>
      <path class="traza" id="traza"></path>
      <circle class="halo" id="halo" r="13"></circle>
      <circle class="cab"  id="cab"  r="5.5"></circle>
    </svg>
  </div>
</div>

<script src="_engine.js"></script>
<script>
/* Caja de un elemento en coordenadas del lienzo, con el punto en su
   CENTRO. Permite anclar una anotación sobre un paso concreto. */
function ancla(el) {
  const b = el.getBoundingClientRect();
  return { x: Math.round(b.left + b.width / 2),
           y: Math.round(b.top + b.height / 2),
           w: Math.round(b.width), h: Math.round(b.height) };
}

const { Ease, span, clamp } = Engine;

const NODO = 64;            // diámetro de la estación, en px de maquetación
const CX = NODO / 2;        // el raíl pasa por el centro de las estaciones

const flujo = document.getElementById('flujo');
const riel  = document.getElementById('riel');
const via   = document.getElementById('via');
const traza = document.getElementById('traza');
const cab   = document.getElementById('cab');
const halo  = document.getElementById('halo');
let pasos = [], idMetal = 'metal';

/* Mezcla en oklab, que es la que no pasa por barro: entre el gris del
   pendiente y la tinta del activo, sRGB baja la saturación por el centro.
   Mismo argumento que en `mapa-calor`, y por eso está escrito una vez. */
function mezcla(a, pa, b) {
  return `color-mix(in oklab, ${a} ${(clamp(pa, 0, 1) * 100).toFixed(1)}%, ${b})`;
}

Engine.register({
  duration: 8,
  defaults: {
    y: 460,
    escalonado: 1.6,       // segundos entre pasos
    hueco: 40,             // aire entre estaciones, en px
                           /* 40 y no 22: el cromo de la ficha activa
                              se sale 14 px por arriba y 16 por abajo,
                              así que con 22 se solapaba 8 px sobre el
                              título de la estación de al lado. */
    entrada: 0.5,
    salida: 0.5,
    pasos: [
      { n: '01', titulo: 'Transcribe', desc: 'Whisper en la GPU del M4.', meta: '6 s' },
      { n: '02', titulo: 'Corta', desc: 'Silencios y tomas falsas fuera.', meta: '0.3 s' },
      { n: '03', titulo: 'Compone', desc: 'Una sola pasada de ffmpeg.', meta: '7 s' }
    ]
  },

  setup(cfg) {
    flujo.style.top = cfg.y + 'px';
    [...flujo.querySelectorAll('.paso')].forEach(n => n.remove());
    idMetal = Engine.gradienteMetal(riel, 'metal', [0, 0, 74, 560]);
    traza.setAttribute('stroke', `url(#${idMetal})`);
    cab.setAttribute('fill', `url(#${idMetal})`);
    halo.setAttribute('fill', `url(#${idMetal})`);

    pasos = cfg.pasos.map(p => {
      const el = document.createElement('div');
      el.className = 'paso';
      el.innerHTML =
        `<div class="nodo">` +
          `<div class="relleno caliente"></div>` +
          `<div class="relleno patina"></div>` +
          `<span class="n">${p.n}</span>` +
        `</div>` +
        `<div class="caja">` +
          `<div class="cromo"></div>` +
          `<div class="titulo">${p.titulo}</div>` +
          `<div class="cuerpo">` +
            (p.desc ? `<div class="desc">${p.desc}</div>` : '') +
            (p.meta ? `<div class="meta"><i></i>${p.meta}</div>` : '') +
          `</div>` +
        `</div>`;
      flujo.appendChild(el);
      const o = {
        el, p,
        nodo:     el.querySelector('.nodo'),
        num:      el.querySelector('.n'),
        caliente: el.querySelector('.caliente'),
        patina:   el.querySelector('.patina'),
        caja:     el.querySelector('.caja'),
        cromo:    el.querySelector('.cromo'),
        titulo:   el.querySelector('.titulo'),
        cuerpo:   el.querySelector('.cuerpo')
      };
      o.grano = Engine.grano(o.cromo, { px: 256, semilla: 11, op: 1 });
      /* La altura desplegada se MIDE una vez, aquí, y no se estima: depende de
         cuántas líneas ocupe la descripción con la fuente real, y a 1080 px de
         ancho una frase de más rompe cualquier número escrito a mano.
         `scrollHeight` fuerza la maquetación en este mismo instante, así que
         no hace falta esperar a un `requestAnimationFrame` —esperarlo dejaba
         el primer fotograma con el raíl sin trazar—. */
      o.hCuerpo = o.cuerpo.scrollHeight;
      return o;
    });

    /* Señales de sonido: un `tic` cuando la cabeza ATRACA en cada estación, que
       es el final de la transición y no su principio. El instante sale de la
       misma expresión que usa `draw` —`cuando(i) + entrada`—, así que si cambia
       el ritmo la señal se mueve con él; copiar la fórmula en vez de
       compartirla es como se desincronizan estas cosas.

       El último lleva `acierto` y no `tic`: un flujo que termina es un
       resultado, no un escalón más. Es la misma distinción que separa
       `notificacion` de `acierto` en el catálogo. */
    const _cuando = i => (cfg.pasos[i] && cfg.pasos[i].at !== undefined)
      ? cfg.pasos[i].at : i * cfg.escalonado;
    const _cues = (cfg.pasos || []).map((p, i) => ({
      at: +(_cuando(i) + cfg.entrada).toFixed(3),
      sfx: i === cfg.pasos.length - 1 ? 'acierto' : 'tic',
      gain: i === cfg.pasos.length - 1 ? 0.7 : 0.55 + 0.05 * i,
    }));
    return { cues: cfg.sinSonido ? [] : _cues };
  },

  anclas() {
    const a = {};
    pasos.forEach(({ el }, i) => { a['paso' + i] = ancla(el); });
    return a;
  },

  draw(t, cfg) {
    const n = pasos.length;
    if (!n) return;
    const fin = cfg.duration || 8;
    const cierre = Engine.sale(t, fin, cfg.salida);
    const ap = span(t, 0, cfg.entrada * 0.8, Ease.outCubic);

    /* Cada paso puede traer su propio `at` en tiempo relativo a la capa. Un
       escalonado uniforme obliga a que la locución hable de los pasos a
       intervalos iguales, y eso no pasa nunca. Sin `at`, se reparte. */
    const cuando = i => (pasos[i] && pasos[i].p && pasos[i].p.at !== undefined)
      ? pasos[i].p.at : i * cfg.escalonado;

    /* --- los tres estados ---------------------------------------------
       Un paso SUBE cuando le toca y BAJA cuando le toca al siguiente, así que
       hay uno solo desplegado en cada instante. Ese es el cambio: antes los
       tres eran la misma ficha tres veces y el gráfico no decía en qué punto
       del proceso estás; ahora la propia forma lo dice.

       `pendiente` es lo que queda: 1 − activo − hecho. No se calcula aparte
       para que los tres sumen exactamente 1 en cualquier instante, también a
       mitad de una transición. */
    const act = [], hec = [];
    for (let i = 0; i < n; i++) {
      const sube = span(t, cuando(i), cfg.entrada, Ease.inOutCubic);
      const baja = i < n - 1
        ? span(t, cuando(i + 1), cfg.entrada, Ease.inOutCubic) : 0;
      hec.push(baja);
      act.push(clamp(sube - baja, 0, 1));
    }

    /* --- maquetación: la altura de cada paso sale de su estado ---------- */
    const cy = [];                       // centro de cada estación, en px
    let y = 0;
    for (let i = 0; i < n; i++) {
      const o = pasos[i];
      const h = o.hCuerpo * act[i];
      o.cuerpo.style.height = h.toFixed(1) + 'px';
      o.el.style.top = y.toFixed(1) + 'px';
      cy.push(y + NODO / 2);
      y += NODO + h + cfg.hueco;
    }
    const y0 = cy[0], yN = cy[n - 1];
    const largo = Math.max(1, yN - y0);

    /* --- el raíl: UN solo trazado, no un segmento por hueco -------------
       Con un `<path>` por hueco, cada tramo se dibujaba solo y el conjunto se
       leía como tres rayas sueltas. Uno continuo con la traza corriendo por
       encima se lee como lo que es: un recorrido, y admite una cabeza que va
       por delante —que es lo que hace que parezca que algo AVANZA y no que
       algo aparece—. */
    const d = 'M ' + CX + ' ' + y0.toFixed(1) +
              cy.slice(1).map(v => ` L ${CX} ${v.toFixed(1)}`).join('');
    via.setAttribute('d', d);
    traza.setAttribute('d', d);
    /* La lámina de bronce se ajusta al raíl de ESTE fotograma: al plegarse un
       paso las estaciones se acercan, y un degradado fijo dejaría el reflejo
       quieto mientras la línea se mueve por debajo. */
    Engine.gradienteMetal(riel, 'metal', [0, y0, 74, yN]);
    const L = via.getTotalLength();
    via.style.strokeDasharray = L;
    traza.style.strokeDasharray = L;

    /* Primero se traza la vía en gris —el plano del proceso—, y solo después
       corre el metal por encima. Dos pasadas por el mismo raíl: el plano y su
       ejecución. */
    const pVia = span(t, 0, cfg.entrada * 1.9, Ease.outCubic);
    via.style.strokeDashoffset = (L * (1 - pVia)).toFixed(2);
    via.style.opacity = cierre;

    /* La traza llega exactamente hasta la estación que está atracando, no a un
       porcentaje del tiempo: se interpola entre centros REALES, que se acaban
       de mover al plegarse el paso anterior. */
    let frente = 0;
    for (let i = 1; i < n; i++) {
      frente += span(t, cuando(i), cfg.entrada, Ease.inOutCubic);
    }
    const i0 = Math.min(n - 2, Math.floor(frente));
    const yF = n < 2 ? y0
      : cy[i0] + (cy[i0 + 1] - cy[i0]) * clamp(frente - i0, 0, 1);
    const pTraza = clamp((yF - y0) / largo, 0, 1);
    traza.style.strokeDashoffset = (L * (1 - pTraza)).toFixed(2);
    traza.style.opacity = cierre * clamp(pVia * 2 - 0.4, 0, 1);

    /* La cabeza va POR DELANTE de la traza, no en su punta: es lo que tira de
       la línea, igual que la chispa va por delante de la mecha quemada. 26 px
       —no un porcentaje— para que la distancia no dependa de cuántos pasos
       haya. Se apaga al atracar en la última. */
    const pCab = clamp(pTraza + 26 / largo, 0, 1);
    const pt = via.getPointAtLength(L * pCab);
    [cab, halo].forEach(c => {
      c.setAttribute('cx', pt.x.toFixed(1));
      c.setAttribute('cy', pt.y.toFixed(1));
    });
    const vivo = cierre * clamp(pVia * 3 - 2, 0, 1) * clamp((1 - pTraza) * 12, 0, 1);
    cab.style.opacity = vivo;
    halo.style.opacity = vivo * 0.17;

    /* --- cada estación ------------------------------------------------- */
    flujo.style.opacity = ap * cierre;
    pasos.forEach((o, i) => {
      const a = act[i], h = hec[i];
      /* Una estación aparece cuando la VÍA la alcanza, no en un escalonado
         propio: así el bloque entero se revela con un solo gesto —el trazado—
         en vez de con tres entradas iguales desplazadas.

         El 12 % de adelanto no es un ajuste fino, es lo que hace que la ÚLTIMA
         estación exista. Está a `yn = 1` exacto, o sea que sin adelanto su
         opacidad es `(pVia − 1) × 9`, que vale 0 mientras se traza y llega a 0
         justo al acabar: el tercer paso no se veía NUNCA. Se descubrió
         mirando el fotograma —el raíl llegaba hasta abajo y no había nada al
         final—, y ni el humo ni el lint lo habrían dicho: la plantilla se
         mueve, tiene anclas y su PNG pesa lo suyo. */
      const yn = (cy[i] - y0) / largo;
      o.el.style.opacity = clamp((pVia * 1.12 - yn) * 9, 0, 1);

      o.caliente.style.opacity = a;
      o.patina.style.opacity = h;
      /* Solo la activa se separa del plano; la terminada vuelve a ras. */
      o.nodo.style.transform = `scale(${(0.9 + 0.1 * a).toFixed(3)})`;
      o.nodo.style.boxShadow = a > 0.01
        ? `0 ${(14 * a).toFixed(1)}px ${(30 * a).toFixed(1)}px var(--sombra)` : 'none';

      /* El peso es el que dice el estado, no el tamaño ni el color: 200 en
         frío, 900 mientras se ejecuta, 500 cuando ya está. Es §1 —jerarquía
         dentro de la línea— y un gesto que solo existe con ejes variables. */
      Engine.peso(o.num, Math.round(200 + 700 * a + 300 * h));
      /* En frío el número iba en `--ink-faint` sobre `--surface`: 3,3:1,
         por debajo del 4,5 de la AA para texto pequeño. Con `--ink-soft` sube
         a 6,1:1 y sigue siendo claramente más callado que el activo, que va en
         `--surface` sobre bronce. */
      o.num.style.color = mezcla('var(--surface)', (a + h) * 1.4, 'var(--ink-soft)');

      /* 200 en frío · 800 ejecutando · 400 hecho. Los tres saltos son de al
         menos 400 puntos, que es el mínimo que §1 exige para que la jerarquía
         viva DENTRO de la línea y no en el cuerpo ni en el color. Con 500 para
         el estado hecho el salto contra el activo era de 300 y no llegaba. */
      Engine.peso(o.titulo, Math.round(200 + 600 * a + 200 * h));
      o.titulo.style.color =
        mezcla('var(--ink)', a, mezcla('var(--ink-soft)', h, 'var(--ink-faint)'));

      /* Flotación de reposo (§10). Va en la FICHA y no en la estación: el
         raíl se calcula con la maquetación, así que una estación que derive
         se despega de su propia vía. Que lo rígido sea el raíl y lo que
         respire sean las fichas además dice algo cierto —la vía es la
         máquina, las fichas son lo que se lee—.

         Sin esto el gráfico se queda congelado BYTE A BYTE de t=3,7 a t=7,5:
         medido con los hashes del humo, dos de los tres instantes eran el
         mismo fotograma. */
      const fl = Engine.flota(t, i, { amp: 3.4, periodo: 8.6, semilla: 5 });
      o.caja.style.transform =
        `translate(${fl.x.toFixed(2)}px, ${fl.y.toFixed(2)}px)`;

      o.cromo.style.opacity = a;
      o.grano.style.opacity = 0.3 * a;
      o.cuerpo.style.opacity = clamp(a * 1.6 - 0.3, 0, 1);
    });
  }
});
</script>
</body>
</html>
