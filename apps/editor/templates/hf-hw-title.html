<!doctype html>
<html lang="en">
  <head>
<!-- /* PALETA-AJENA: inicio */ -->
    <meta charset="utf-8" />
    <script src="_gsap.min.js"></script>
    <style>
      /* El @font-face apuntaba a `assets/fonts/Caveat-700-latin.woff2`, que en
         este repo no existe: cada render escupía un ERR_FILE_NOT_FOUND y el
         texto caía a `cursive` —Snell Roundhand— sin que ningún log lo dijera.
         Caveat SÍ está instalada en la máquina (medido en el mismo Chromium
         que rasteriza: 620,8 px contra 717,7 del respaldo), así que se resuelve
         por familia local y el error desaparece. */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #hw-t-root {
        /* ---- hw tokens ---- */
        --hw-font-print: "Caveat", cursive;
        --hw-font-script: "Caveat", cursive;
        --hw-ink: var(--ink);
        --hw-ink-dark: #26241f;
        --hw-accent-warm: #ffb020;

        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent; /* overlays footage or a board */
        font-family: var(--hw-font-print, "Caveat", cursive);
      }
      #hw-t-wrap {
        position: absolute;
        pointer-events: none;
      }
      #hw-t-line {
        font-weight: 700;
        line-height: 1.1;
        white-space: nowrap;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.4);
      }
      #hw-t-line .w {
        display: inline;
      }
      #hw-t-under {
        overflow: visible;
        display: block;
      }
      #hw-t-under path {
        fill: none;
        stroke: var(--hw-accent-warm);
        stroke-width: 7;
        stroke-linecap: round;
      }
    </style>
    <link rel="stylesheet" href="_tokens.css">
  <script src="_engine.js"></script>
</head>
  <body>
    <div
      id="hw-t-root"
      data-composition-id="hw-title"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <div id="hw-t-wrap">
        <div id="hw-t-line"></div>
        <svg id="hw-t-under" width="10" height="34"><path id="hw-t-under-path"></path></svg>
      </div>
      <div
        id="hw-t-drv"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters ----
           Handwritten title with the highlight-sweep scalar (the shared
           mk-callout-highlight mechanic) + squiggle underline + the boil.
           Demonstrates the dispatcher composing sweep + boil on one
           timeline (learning: one onUpdate — everything through hwOnUpdate). */
        var CONFIG = {
          text: "shine like the star you are",
          /* Techo, no medida: el cuerpo real se AJUSTA abajo hasta que el
             titular cabe en `lineas` renglones dentro del ancho de la caja.
             Un número fijo en un lienzo vertical o desborda o se queda
             pequeño, según lo que escriba el guion. */
          fontSize: 240,
          anchoCaja: 0.92, // fracción del lienzo que ocupa el bloque
          lineas: 2,
          scheme: "chalk", // "chalk" (white, over footage) | "ink" (dark, boards)
          sweep: { enabled: true, start: 0.8, end: 3.2 },
          underline: { enabled: true, wobble: 6 },
          boil: { enabled: true, amp: 1.4, rot: 0.3, frameDrop: 3 },
          seed: 8,
          x: null, // null = centered
          y: null,
          animationIn: true,
          animationOut: true,
        };

        var DUR = 6;
        function clamp(v, lo, hi) {
          return Math.min(hi, Math.max(lo, v));
        }
        var IN = clamp(DUR * 0.08, 0.3, 0.8);
        var OUT = clamp(DUR * 0.06, 0.25, 0.6);

        /* hw family runtime */
        window.hwOnUpdate = function (tl, fn) {
          if (!tl.__hwRenders) {
            tl.__hwRenders = [];
            tl.eventCallback("onUpdate", function () {
              for (var i = 0; i < tl.__hwRenders.length; i++) tl.__hwRenders[i]();
            });
          }
          tl.__hwRenders.push(fn);
          fn();
        };
        window.hwHash = function (n, seed) {
          var x = Math.sin(n * 127.1 + (seed || 1) * 311.7) * 43758.5453;
          return (x - Math.floor(x)) * 2 - 1;
        };
        window.hwBoil = function (tl, target, opts) {
          opts = opts || {};
          var amp = opts.amp !== undefined ? opts.amp : 1.6;
          var rot = opts.rot !== undefined ? opts.rot : 0.5;
          var fps = opts.fps || 30;
          var drop = opts.frameDrop || 3;
          var seed = opts.seed || 1;
          var els = gsap.utils.toArray(target);
          window.hwOnUpdate(tl, function () {
            var step = Math.floor((tl.time() * fps) / drop);
            for (var i = 0; i < els.length; i++) {
              gsap.set(els[i], {
                x: window.hwHash(step * 3 + i * 97, seed) * amp,
                y: window.hwHash(step * 3 + 1 + i * 97, seed) * amp,
                rotation: (opts.baseRot || 0) + window.hwHash(step * 3 + 2 + i * 97, seed) * rot,
              });
            }
          });
        };

        var FULL = CONFIG.scheme === "ink" ? "#26241f" : "#f4f2ec";
        var FAINT = CONFIG.scheme === "ink" ? "rgba(38,36,31,0.3)" : "rgba(244,242,236,0.32)";

        /* El lienzo de ESTE repo. La maqueta original era 1920x1080 y el
           titular iba en una sola línea sin ajuste; aquí es 1080x1920 y un
           renglón de 27 caracteres no cabe a ningún cuerpo que se lea. */
        var LIENZO_W = 1080,
          LIENZO_H = 1920;
        var CAJA = Math.round(LIENZO_W * CONFIG.anchoCaja);

        var wrap = document.getElementById("hw-t-wrap");
        var line = document.getElementById("hw-t-line");
        wrap.style.width = CAJA + "px";
        line.style.width = CAJA + "px";
        line.style.whiteSpace = "normal";
        line.style.textAlign = "center";
        line.style.fontSize = CONFIG.fontSize + "px";

        /* word spans */
        var wordEls = [];
        CONFIG.text.split(/\s+/).forEach(function (w, i) {
          if (i > 0) line.appendChild(document.createTextNode(" "));
          var span = document.createElement("span");
          span.className = "w";
          span.textContent = w;
          span.style.color = CONFIG.sweep.enabled ? FAINT : FULL;
          line.appendChild(span);
          wordEls.push(span);
        });

        var underPath = document.getElementById("hw-t-under-path");

        /* Los RENGLONES de verdad: un rectángulo por fragmento, agrupados por
           su `top`. Dividir la altura entre la interlínea también cuenta
           líneas, pero no dice CUÁNTO ocupa la más ancha, que es lo que la
           rúbrica tiene que medir.
           Se agrupa con TOLERANCIA y no por `top` exacto: el boil rota la
           caja unas décimas de grado, así que los fragmentos de una misma
           línea llegan con tops escalonados —652,50 · 652,65 · 652,79— y
           redondeando se partían en dos filas. El ajuste lo leía como una
           línea de más y bajaba el cuerpo de 216 a 184 px sin motivo. */
        function renglones() {
          var rg = document.createRange();
          rg.selectNodeContents(line);
          var rs = rg.getClientRects();
          var tol = parseFloat(getComputedStyle(line).fontSize) * 0.5;
          var filas = [];
          for (var i = 0; i < rs.length; i++) {
            if (rs[i].width < 1) continue;
            var f = null;
            for (var j = 0; j < filas.length; j++)
              if (Math.abs(filas[j].t - rs[i].top) < tol) {
                f = filas[j];
                break;
              }
            if (!f) {
              f = { t: rs[i].top, a: rs[i].left, b: rs[i].right };
              filas.push(f);
            }
            if (rs[i].left < f.a) f.a = rs[i].left;
            if (rs[i].right > f.b) f.b = rs[i].right;
          }
          var ancho = 0;
          for (var k = 0; k < filas.length; k++) ancho = Math.max(ancho, filas[k].b - filas[k].a);
          return { n: filas.length, ancho: Math.round(ancho) };
        }

        /* LA MAQUETA, en una función y no en línea recta, porque hay que
           rehacerla: durante el parseo ni la hoja enlazada ni la fuente
           local están aplicadas, así que el ajuste se quedaba en 220 px —dos
           renglones con las métricas de respaldo— y al aplicarse Caveat el
           titular reflowaba a TRES y la rúbrica se cruzaba con el
           descendente de la última. Ningún log lo decía.
           `document.fonts.ready` NO sirve de barrera: no hay @font-face que
           esperar —la familia es local—, así que resuelve en el microtask
           siguiente, con las mismas métricas equivocadas. */
        var med = { n: 1, ancho: CAJA };
        function maqueta() {
          for (var fs = CONFIG.fontSize; fs > 72; fs -= 4) {
            line.style.fontSize = fs + "px";
            med = renglones();
            if (med.n <= CONFIG.lineas) break;
          }

          var rect = line.getBoundingClientRect();
          wrap.style.left =
            (CONFIG.x === null ? Math.round((LIENZO_W - CAJA) / 2) : CONFIG.x) + "px";
          wrap.style.top =
            (CONFIG.y === null ? Math.round((LIENZO_H - rect.height) / 2) - 90 : CONFIG.y) + "px";

          if (!CONFIG.underline.enabled) {
            document.getElementById("hw-t-under").style.display = "none";
            return;
          }
          /* La rúbrica se ciñe al renglón más ancho, no a la caja: subrayar
             994 px bajo una línea de 700 se lee como una regla suelta. */
          var uw = Math.max(240, med.ancho);
          var svg = document.getElementById("hw-t-under");
          svg.setAttribute("width", uw);
          svg.setAttribute("viewBox", "0 0 " + uw + " 34");
          /* `pathLength` fija la longitud DECLARADA del trazo en 1000, así
             que el `strokeDasharray` del revelado no caduca cuando la
             maqueta se rehace y la geometría cambia. Con getTotalLength() el
             arranque quedaba grabado con la longitud vieja y la rúbrica
             aparecía ya medio dibujada. */
          underPath.setAttribute("pathLength", "1000");
          var segs = Math.max(6, Math.round(uw / 90));
          var d = "M 2 " + (16 + window.hwHash(0, CONFIG.seed) * 4).toFixed(1);
          for (var i = 1; i <= segs; i++) {
            var x = (uw / segs) * i;
            var y = 16 + window.hwHash(i * 5 + 1, CONFIG.seed) * CONFIG.underline.wobble;
            var cxp = x - uw / segs / 2 + window.hwHash(i * 5 + 2, CONFIG.seed) * 10;
            var cyp = 16 + (i % 2 ? -1 : 1) * (8 + window.hwHash(i * 5 + 3, CONFIG.seed) * 4);
            d +=
              " Q " +
              cxp.toFixed(1) +
              " " +
              cyp.toFixed(1) +
              " " +
              x.toFixed(1) +
              " " +
              y.toFixed(1);
          }
          underPath.setAttribute("d", d);
        }
        maqueta();

        var tl = gsap.timeline({ paused: true });

        if (CONFIG.animationIn) {
          gsap.set(wrap, { opacity: 0 });
          tl.to(wrap, { opacity: 1, duration: IN, ease: "power2.out" }, 0.1);
        }

        /* the sweep scalar — registered through the dispatcher so it
           coexists with the boil on the same timeline */
        if (CONFIG.sweep.enabled) {
          var mix = gsap.utils.interpolate(FAINT, FULL);
          var st = { p: 0 };
          window.hwOnUpdate(tl, function () {
            var k = st.p * wordEls.length;
            for (var i = 0; i < wordEls.length; i++) {
              var f = Math.max(0, Math.min(1, k - i));
              wordEls[i].style.color = mix(f);
            }
          });
          tl.to(
            st,
            { p: 1, duration: CONFIG.sweep.end - CONFIG.sweep.start, ease: "none" },
            CONFIG.sweep.start,
          );
        }

        /* underline draws as the sweep lands */
        if (CONFIG.underline.enabled) {
          var len = 1000; /* la declarada por `pathLength`, no la geométrica */
          gsap.set(underPath, { strokeDasharray: len, strokeDashoffset: len });
          var uAt = CONFIG.sweep.enabled ? CONFIG.sweep.end - 0.2 : 0.8;
          tl.to(underPath, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, uAt);
        }

        /* La maqueta se REVISA en cada fotograma y se rehace solo si el
           titular se ha desbordado a un renglón de más. Es una medida por
           fotograma —un Range— y es lo único que garantiza que la maqueta
           sea la buena cuando se captura: `setup` es del puente y no se
           puede tocar, y el parseo llega demasiado pronto. */
        window.hwOnUpdate(tl, function () {
          if (renglones().n > CONFIG.lineas) maqueta();
        });

        if (CONFIG.boil.enabled) {
          window.hwBoil(tl, "#hw-t-wrap", {
            amp: CONFIG.boil.amp,
            rot: CONFIG.boil.rot,
            frameDrop: CONFIG.boil.frameDrop,
            seed: CONFIG.seed,
          });
        }

        if (CONFIG.animationOut) {
          tl.to(wrap, { opacity: 0, duration: OUT, ease: "power2.in" }, DUR - OUT - 0.05);
        }
        tl.set("#hw-t-root", { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["hw-title"] = tl;
      })();
    </script>
  

<!-- /* PALETA-AJENA: fin */ -->








<!-- PUENTE:inicio · generado por scripts/importar_bloque.js -->
<style>
  /* El lienzo de este repo, y la raíz TRANSPARENTE: si el fondo llega opaco,
     omitBackground no lo recorta y los PNG salen sin alfa — el compositor
     los pega como un rectángulo y tapa el metraje. */
  html, body { width: 1080px; height: 1920px; margin: 0;
               background: transparent !important; overflow: hidden; }
  [data-composition-id="hw-title"] { transform-origin: 50% 50%; }
  /* El PLAFÓN DE AUTO-PREVISUALIZACIÓN. Varias piezas del catálogo traen un
     fondo propio para poder mirarse solas —hf-hw-callout-circle lo llama
     literalmente «self-preview scene» y es un degradado verde— y sobre
     nuestro metraje eso no es un fondo: es una mancha que tapa el plano.
     Se quita el relleno y se deja el contenido, que es lo que se quería. */
  [id$="-scene"] { background: none !important; }
</style>
<script>
(function () {
  var ID = "hw-title";
  var RANURAS = {"lineas":"#hw-t-line"};
  var raiz = document.querySelector('[data-composition-id="' + ID + '"]');
  var tl = (window.__timelines || {})[ID] || null;

  /* Maqueta a 1920x1080 y aquí el lienzo es 1080x1920: se escala al ancho y
     se centra. Es un APAÑO declarado, no una solución — la buena es rehacer
     la maqueta en vertical. config.encaje:false lo desactiva y
     config.escala lo fuerza.
     La medida sale de data-width/data-height y NO de offsetWidth: la raíz de
     varios bloques mide 0x0 —es un ancla para hijos posicionados, no una
     caja— y con la medida del DOM el encaje la mandaba a left:-420, fuera
     del cuadro. Fotograma transparente, cero errores, y el humo diciendo
     «no se mueve» porque no había nada que moviera. Por eso se envuelve en
     una caja del tamaño DECLARADO: así los hijos absolutos tienen un
     contenedor de verdad y la escala se aplica a algo con dimensiones. */
  var caja = null;
  function encaja(cfg) {
    if (!raiz || cfg.encaje === false) return;
    var w = +raiz.dataset.width || raiz.offsetWidth || 1920;
    var h = +raiz.dataset.height || raiz.offsetHeight || 1080;
    if (!caja) {
      caja = document.createElement('div');
      raiz.parentNode.insertBefore(caja, raiz);
      caja.appendChild(raiz);
    }
    caja.style.cssText = 'position:absolute;left:0;top:0;width:' + w
                       + 'px;height:' + h + 'px;transform-origin:0 0;';
    raiz.style.position = 'absolute';
    raiz.style.left = '0'; raiz.style.top = '0';
    raiz.style.width = w + 'px'; raiz.style.height = h + 'px';
    var k = cfg.escala || Math.min(1080 / w, 1920 / h);
    /* DÓNDE, y no solo cuánto. Centrado es lo razonable por defecto, pero un
       rótulo inferior centrado en un lienzo vertical queda en mitad de la
       cara; y §18 dice que la banda de abajo la pinta la app. zona mueve la
       caja ya escalada sin tocar la maqueta de dentro: arriba pega bajo la
       banda superior (230 px), abajo se apoya sobre la inferior (1459 px). */
    var alto = h * k;
    var y = (1920 - alto) / 2;
    if (cfg.zona === 'arriba') y = 230 + 40;
    else if (cfg.zona === 'abajo') y = 1459 - 40 - alto;
    caja.style.transform = 'translate(' + Math.round((1080 - w * k) / 2)
      + 'px,' + Math.round(y) + 'px) scale(' + k + ')';
  }

  /* LA CAJA DE TINTA, para colocar.py.
     Sin anclas() una capa es invisible para el colocador: no sabe cuánto
     ocupa ni dónde, así que no puede apartarla del rostro ni avisar de que
     cae bajo el caption de la app. Nuestras plantillas la declaran a mano
     porque saben qué parte de sí mismas importa; un bloque importado no
     puede saberlo, así que se MIDE: unión de los rectángulos visibles, ya en
     coordenadas de lienzo —getBoundingClientRect incluye la transformación
     del encaje—, descartando los contenedores que cubren casi todo.
     Se llama después de seek, así que la caja es la del instante que se
     esté mirando y no la del reposo. */
  function tinta() {
    if (!raiz) return null;
    /* Dos pasadas. La primera descarta los contenedores que cubren casi todo
       —si no, la caja de cualquier plantilla sería el lienzo entero y el dato
       no diría nada—. Pero en las de dibujo a mano el contenido ES un <svg> a
       pantalla completa y sus <path> devuelven cajas de cero: con el filtro
       puesto, veintisiete plantillas se quedaban sin ancla. Si la primera
       pasada no deja nada, se repite SIN filtro: una caja grande de más es
       peor que ninguna, pero ninguna es peor que las dos. */
    function une(filtra) {
      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      var todos = raiz.querySelectorAll('*');
      for (var i = 0; i < todos.length; i++) {
        var e = todos[i], s = getComputedStyle(e);
        if (s.display === 'none' || s.visibility === 'hidden' ||
            parseFloat(s.opacity) < 0.05) continue;
        var r = e.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) continue;
        if (filtra && r.width * r.height > 0.92 * 1080 * 1920) continue;
        if (r.left < x0) x0 = r.left;
        if (r.top < y0) y0 = r.top;
        if (r.right > x1) x1 = r.right;
        if (r.bottom > y1) y1 = r.bottom;
      }
      return x1 < x0 ? null : [x0, y0, x1, y1];
    }
    var c = une(true) || une(false);
    if (!c) return null;
    var x0 = c[0], y0 = c[1], x1 = c[2], y1 = c[3];
    x0 = Math.max(0, x0); y0 = Math.max(0, y0);
    x1 = Math.min(1080, x1); y1 = Math.min(1920, y1);
    return { bloque: { x: Math.round((x0 + x1) / 2), y: Math.round((y0 + y1) / 2),
                       w: Math.round(x1 - x0), h: Math.round(y1 - y0) } };
  }

  /* LA SALIDA, que sus bloques no tienen: entran y se quedan puestos hasta
     que la composición acaba. Aquí una capa vive dentro de su ventana y
     tiene que irse, y no es cosmética — es lo que humo_plantillas.js
     comprueba cuando muestrea tres instantes y exige que no sean el mismo
     fotograma. Medido: x-post y macos-notification animan su entrada y dan
     tres capturas idénticas después.
     Es una salida GENÉRICA —se va bajando y encogiendo un pelo— y por eso
     se puede apagar con config.salida:false cuando el bloque tenga la suya
     propia. Determinista: solo depende de t. */
  var SALIDA = 0.42;
  /* La duración del GESTO, medida al importar. La sustituye el importador;
     el valor de aquí es el de respaldo para quien abra el fichero suelto.
     Va en una variable y no en dos sitios a propósito: la salida tiene que
     caer dentro de la MISMA ventana que registra la plantilla, y cuando eran
     dos números —la declarada por la timeline y la registrada— la salida se
     programaba fuera del tramo que nadie llega a ver. */
  /* El copy que el plan pide, repartido por orden sobre las ranuras que
     declara TEXTOS. Lo que sobra se ignora; lo que falta se queda con lo que
     el bloque traía.
     Se aplica en CADA fotograma y no solo al montar, y no es por comodidad:
     varios bloques animan su propio texto —un contador que sube, un
     tecleado— así que su timeline reescribe el nodo en cada seek y el copy
     del plan duraba un fotograma. Medido: la tarjeta pedía «−12» y salía el
     «22» de la demo. */
  function copia(cfg) {
    for (var k in RANURAS) {
      if (!cfg || !cfg[k] || !cfg[k].length) continue;
      var nodos = document.querySelectorAll(RANURAS[k]);
      for (var i = 0; i < nodos.length && i < cfg[k].length; i++) {
        if (nodos[i].textContent !== cfg[k][i]) nodos[i].textContent = cfg[k][i];
      }
    }
  }

  var DUR = 6;   /* MEDIDO al importar */
  var vida = DUR;

  Engine.register({
    duration: DUR,
    /* Las ranuras se escriben LITERALES en los defaults, no con un
       Object.assign: lint_config.py lee ese bloque con una expresión regular
       —no ejecuta la plantilla— así que una clave calculada no existe para
       él y el plan que la usa aborta por «clave que la plantilla no lee».
       Las ranuras entran aquí porque lint_config.py --estricto
       comprueba que toda clave del plan la lea de verdad su plantilla: sin
       declararlas, pedir el copy por config es una clave muerta y el paso
       aborta. */
    defaults: { encaje: true, escala: null, zona: 'centro', salida: true,
                tema: 'carbon', cue: null, cueGain: null, lineas: null },
    setup: function (cfg) {
      encaja(cfg);
      vida = cfg.duration || DUR;
      copia(cfg);
      /* EL SONIDO: NINGUNO por defecto, y esto es una vuelta atrás.
         Se publicaba un «aparicion» genérico en cada bloque importado para
         que no entraran mudos. Sobre la pieza montada suena a lo que es: el
         mismo golpe blando en 126 sitios, puesto por una regla que no sabe
         qué está entrando. Un sonido que no significa nada es peor que el
         silencio, porque el oído lo cuenta igual.
         Quien sabe qué suena una capa es el guion —sfx en la capa— o la
         tabla del director para las plantillas que conoce. Con cue en la
         config se puede pedir uno a mano. */
      return { cues: (!cfg.sinSonido && cfg.cue)
                     ? [{ at: 0.04, sfx: cfg.cue, gain: cfg.cueGain || 0.5 }]
                     : [] };
    },
    anclas: function () { return tinta(); },
    /* El puente entero. Los dos motores hacen lo mismo —posicionar una
       animación en el segundo t, sin tocar el reloj del navegador—, así que
       no hay nada que traducir. */
    /* La salida va en la raíz y el encaje en la caja que la envuelve: dos
       transformaciones en dos nodos, para que no se pisen. */
    draw: function (t, cfg) {
      if (tl) tl.time(Math.max(0, Math.min(t, tl.duration())));
      copia(cfg);
      if (!raiz) return;
      if (cfg && cfg.salida !== false && vida > SALIDA) {
        var d = (t - (vida - SALIDA)) / SALIDA;
        if (d > 0) {
          var e = 1 - Math.min(1, d);
          e = e * e * (3 - 2 * e);              /* suavizado, sin rebote */
          raiz.style.opacity = e;
          raiz.style.transform = 'translateY(' + ((1 - e) * -26).toFixed(2)
                               + 'px) scale(' + (0.985 + 0.015 * e).toFixed(4) + ')';
          return;
        }
      }
      raiz.style.opacity = '';
      raiz.style.transform = '';
    }
  });
})();
</script>
<!-- PUENTE:fin -->

     renglón; aquí la raíz declara ya 1080x1920 (el puente no escala) y el
     cuerpo se ajusta en el script hasta caber en dos líneas. Lo que queda es
     el aire y el grosor del trazo, que a 216 px de cuerpo son otros. */
  /* La rúbrica iba pegada al bloque y la cruzaba el descendente de la última

  #hw-t-under {
