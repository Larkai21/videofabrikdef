    <meta charset="UTF-8" />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      #highlight {
        pointer-events: none;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #hl-video {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hl-overlay {
        position: absolute;
        inset: 0;
        background: transparent;
        z-index: 1;
        pointer-events: none;
      }
      #hl-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      .hl-group {
        position: absolute;
        bottom: 140px;
        left: 0;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: center;
        gap: 8px;
        padding: 0 100px;
        opacity: 0;
        visibility: hidden;
      }
      .hl-word {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 80px;
        text-transform: uppercase;
        color: var(--hf-caption-primary, #ffffff);
        display: inline-block;
        letter-spacing: 0.02em;
        line-height: 1;
        position: relative;
        padding: 6px 12px 8px;
        text-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        transform-origin: 50% 58%;
        will-change: transform, filter;
      }
      .hl-word-bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          var(--hf-caption-accent, #ff1745) 0%,
          color-mix(in srgb, var(--hf-caption-accent, #ff1745) 82%, #000) 100%
        );
        border-radius: 10px;
        box-shadow: 0 12px 30px rgba(229, 20, 58, 0.32);
        opacity: 0;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        z-index: -1;
      }
      .hl-word-text {
        position: relative;
        z-index: 1;
      }
    </style>

  <body>
    <div
      id="highlight"
      data-composition-id="caption-highlight"
      data-timeline-locked
      data-start="0"
      data-duration="8"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div class="hl-overlay"></div>
      <div id="hl-container"></div>
    </div>

    <script>
      (function () {
        var HF_COMPOSITION_ID = "caption-highlight";
        var HF_ROOT_ID = "highlight";
        var HF_GROUP_SELECTOR = ".hl-group";

        window.__timelines = window.__timelines || {};

        var _fitCanvas = document.createElement("canvas");
        var _fitCtx = _fitCanvas.getContext("2d");
        function fitFontSize(text, baseFontSize, fontWeight, fontFamily, maxWidth) {
          var size = baseFontSize;
          var minSize = Math.floor(baseFontSize * 0.45);
          // minSize is a hard floor returned unverified below — self-heal
          // accepts residual overflow at the floor (clipped by the stage)
          // rather than shrinking below legibility.
          while (size > minSize) {
            _fitCtx.font = fontWeight + " " + size + "px " + fontFamily;
            if (_fitCtx.measureText(text).width <= maxWidth) return size;
            size -= 2;
          }
          return minSize;
        }

        var HF_DEMO_DATA = {
          version: 1,
          segments: [
            {
              start: 0,
              text: "Every great video starts with a single frame. HyperFrames lets you write HTML and render professional video. No timeline. No drag and drop. Just code that becomes cinema.",
              words: [
                { text: "Every", start: 0.0, end: 0.3 },
                { text: "great", start: 0.3, end: 0.55 },
                { text: "video", start: 0.55, end: 0.85 },
                { text: "starts", start: 0.85, end: 1.1 },
                { text: "with", start: 1.1, end: 1.25 },
                { text: "a", start: 1.25, end: 1.35 },
                { text: "single", start: 1.35, end: 1.65 },
                { text: "frame.", start: 1.65, end: 2.0 },
                { text: "HyperFrames", start: 2.1, end: 2.65 },
                { text: "lets", start: 2.65, end: 2.85 },
                { text: "you", start: 2.85, end: 2.95 },
                { text: "write", start: 2.95, end: 3.15 },
                { text: "HTML", start: 3.15, end: 3.55 },
                { text: "and", start: 3.55, end: 3.65 },
                { text: "render", start: 3.65, end: 3.95 },
                { text: "professional", start: 3.95, end: 4.45 },
                { text: "video.", start: 4.45, end: 4.8 },
                { text: "No", start: 4.9, end: 5.05 },
                { text: "timeline.", start: 5.05, end: 5.45 },
                { text: "No", start: 5.5, end: 5.65 },
                { text: "drag", start: 5.65, end: 5.85 },
                { text: "and", start: 5.85, end: 5.95 },
                { text: "drop.", start: 5.95, end: 6.25 },
                { text: "Just", start: 6.35, end: 6.55 },
                { text: "code", start: 6.55, end: 6.8 },
                { text: "that", start: 6.8, end: 6.95 },
                { text: "becomes", start: 6.95, end: 7.3 },
                { text: "cinema.", start: 7.3, end: 7.7 },
              ],
            },
          ],
        };

        /* ── HyperFrames caption-data runtime (shared across caption templates) ── */
        var HF_CONTRACT_VERSION = 1;
        var HF_DEFAULT_RESOLUTION = { width: 1920, height: 1080 };

        function hfFlattenSegments(segments) {
          var out = [];
          (segments || []).forEach(function (seg) {
            ((seg && seg.words) || []).forEach(function (w) {
              var start = Math.max(0, Number(w.start) || 0);
              out.push({
                text: String(w.word || w.text || "").trim(),
                start: start,
                end: Math.max(start, Number(w.end) || 0),
              });
            });
          });
          out.sort(function (a, b) {
            return a.start - b.start;
          });
          return out.filter(function (w) {
            return w.text.length > 0;
          });
        }

        function hfDeriveDuration(words) {
          var end = 0;
          words.forEach(function (w) {
            if (w.end > end) end = w.end;
          });
          return end;
        }

        function hfValidate(data) {
          if (!data || typeof data !== "object") return { ok: false, reason: "not-an-object" };
          if (data.version != null) {
            // Number("v2") is NaN and NaN > x is always false — an explicit
            // finite check keeps malformed versions from slipping past the gate.
            var hfVersion = Number(data.version);
            if (!Number.isFinite(hfVersion) || Math.floor(hfVersion) > HF_CONTRACT_VERSION) {
              return { ok: false, reason: "unsupported-version" };
            }
          }
          if (!Array.isArray(data.segments) || data.segments.length === 0) {
            return { ok: false, reason: "no-segments" };
          }
          if (data.displayMode != null && data.displayMode !== "full") {
            return { ok: false, reason: "unsupported-displayMode" };
          }
          var words = hfFlattenSegments(data.segments);
          if (words.length === 0) return { ok: false, reason: "no-words" };
          return { ok: true, words: words, durationS: hfDeriveDuration(words) };
        }

        function hfApplyStageConfig(data, durationS) {
          var res = (data && data.resolution) || HF_DEFAULT_RESOLUTION;
          // Mirror the published validator's <=8192 bound defensively — the
          // validator is an optional pre-flight, and an unbounded stage size
          // would OOM render workers.
          var W = Math.min(
            8192,
            Math.max(1, Math.round(Number(res.width) || HF_DEFAULT_RESOLUTION.width)),
          );
          var H = Math.min(
            8192,
            Math.max(1, Math.round(Number(res.height) || HF_DEFAULT_RESOLUTION.height)),
          );
          var root = document.getElementById(HF_ROOT_ID);
          [document.documentElement, document.body, root].forEach(function (el) {
            el.style.width = W + "px";
            el.style.height = H + "px";
          });
          root.setAttribute("data-width", String(W));
          root.setAttribute("data-height", String(H));
          root.setAttribute("data-duration", String(durationS));
          var brand = (data && data.brand) || {};
          if (typeof brand.primaryColor === "string" && brand.primaryColor) {
            root.style.setProperty("--hf-caption-primary", brand.primaryColor);
          } else {
            root.style.removeProperty("--hf-caption-primary");
          }
          if (typeof brand.accentColor === "string" && brand.accentColor) {
            root.style.setProperty("--hf-caption-accent", brand.accentColor);
          } else {
            root.style.removeProperty("--hf-caption-accent");
          }
          return {
            W: W,
            H: H,
            scaleX: W / 1920,
            scaleY: H / 1080,
            fontScale: Math.min(W, H) / 1080,
          };
        }

        function hfPublishStatus(status) {
          window.__HF_CAPTION_STATUS = status;
          document
            .getElementById(HF_ROOT_ID)
            .setAttribute("data-caption-status", status.ok ? "ok" : "failed");
        }

        function hfRunGate(words, durationS, failReason) {
          if (failReason) {
            hfPublishStatus({
              ok: false,
              present: false,
              contained: false,
              reason: failReason,
              version: HF_CONTRACT_VERSION,
              durationS: durationS || 0,
            });
            return;
          }
          var root = document.getElementById(HF_ROOT_ID);
          var rootRect = root.getBoundingClientRect();
          var groups = root.querySelectorAll(HF_GROUP_SELECTOR);
          var present = false;
          var contained = true;
          var tokens = [];
          words.forEach(function (w) {
            var t = w.text.toLowerCase().replace(/[^a-z0-9]/g, "");
            if (t) tokens.push(t);
          });
          groups.forEach(function (el) {
            var prevOpacity = el.style.opacity;
            var prevVisibility = el.style.visibility;
            el.style.opacity = "1";
            el.style.visibility = "visible";
            var r = el.getBoundingClientRect();
            if (r.width > 0 && r.height > 0) {
              var text = (el.textContent || "").toLowerCase();
              for (var i = 0; i < tokens.length; i++) {
                if (text.indexOf(tokens[i]) !== -1) {
                  present = true;
                  break;
                }
              }
              if (
                r.left < rootRect.left - 1 ||
                r.right > rootRect.right + 1 ||
                r.top < rootRect.top - 1 ||
                r.bottom > rootRect.bottom + 1
              ) {
                contained = false;
              }
            }
            el.style.opacity = prevOpacity;
            el.style.visibility = prevVisibility;
          });
          hfPublishStatus({
            ok: present && contained,
            present: present,
            contained: contained,
            version: HF_CONTRACT_VERSION,
            durationS: durationS,
          });
        }

        var MAX_WORDS_PER_GROUP = 4;
        var PAUSE_THRESHOLD = 0.1;

        function hfMakeGroups(words, fontPx, safeWidth, durationS) {
          var raw = [];
          var current = [];
          function fits(ws) {
            var text = ws
              .map(function (w) {
                return w.text.toUpperCase();
              })
              .join(" ");
            _fitCtx.font = "800 " + fontPx + "px Montserrat";
            // 1.6× headroom: fitFontSize can shrink to 45% of base
            return _fitCtx.measureText(text).width <= safeWidth * 1.6;
          }
          words.forEach(function (w, i) {
            var next = words[i + 1];
            var test = current.concat([w]);
            if (test.length > MAX_WORDS_PER_GROUP || !fits(test)) {
              if (current.length) raw.push(current);
              current = [w];
            } else {
              current.push(w);
            }
            var punctuation = /[,.:!?]$/.test(w.text);
            var pause = next ? next.start - w.end : Infinity;
            if (
              current.length &&
              (punctuation ||
                pause >= PAUSE_THRESHOLD ||
                current.length >= MAX_WORDS_PER_GROUP ||
                !next)
            ) {
              raw.push(current);
              current = [];
            }
          });
          if (current.length) raw.push(current);
          return raw.map(function (ws, gi) {
            var nextStart = gi + 1 < raw.length ? raw[gi + 1][0].start : durationS;
            return {
              words: ws,
              start: ws[0].start,
              end: Math.min(
                ws[ws.length - 1].end + 0.5,
                Math.max(ws[0].start + 0.2, nextStart - 0.05),
              ),
            };
          });
        }

        function hfTeardown() {
          document.getElementById("hl-container").innerHTML = "";
        }

        function hfBuild(words, layout, durationS) {
          var fontPx = Math.round(80 * layout.fontScale);
          var safeWidth = Math.round(1620 * layout.scaleX);
          var container = document.getElementById("hl-container");
          var groups = hfMakeGroups(words, fontPx, safeWidth, durationS);
          var tl = gsap.timeline({ paused: true });
          var wordCounter = 0;

          groups.forEach(function (g, gi) {
            var grp = document.createElement("div");
            grp.className = "hl-group";
            grp.id = "hl-grp-" + gi;
            grp.style.bottom = Math.round(140 * layout.scaleY) + "px";
            grp.style.paddingLeft = Math.round(100 * layout.scaleX) + "px";
            grp.style.paddingRight = Math.round(100 * layout.scaleX) + "px";

            var groupText = g.words
              .map(function (w) {
                return w.text.toUpperCase();
              })
              .join(" ");
            var computedSize = fitFontSize(groupText, fontPx, "800", "Montserrat", safeWidth);

            var ids = [];
            g.words.forEach(function (w) {
              var wi = wordCounter++;
              ids.push(wi);
              var wordEl = document.createElement("span");
              wordEl.className = "hl-word";
              wordEl.id = "hl-w-" + wi;
              wordEl.style.fontSize = computedSize + "px";
              var bgEl = document.createElement("span");
              bgEl.className = "hl-word-bg";
              bgEl.id = "hl-bg-" + wi;
              var textEl = document.createElement("span");
              textEl.className = "hl-word-text";
              textEl.textContent = w.text.toUpperCase();
              wordEl.appendChild(bgEl);
              wordEl.appendChild(textEl);
              grp.appendChild(wordEl);
            });
            container.appendChild(grp);

            tl.set(grp, { visibility: "visible" }, g.start);
            tl.fromTo(
              grp,
              { opacity: 0 },
              { opacity: 1, duration: 0.12, ease: "power2.out" },
              g.start,
            );
            g.words.forEach(function (w, i) {
              var bgEl = document.getElementById("hl-bg-" + ids[i]);
              var wordEl = document.getElementById("hl-w-" + ids[i]);
              tl.to(bgEl, { opacity: 1, scaleX: 1, duration: 0.15, ease: "power2.out" }, w.start);
              tl.to(
                wordEl,
                { filter: "brightness(1.05)", duration: 0.08, ease: "power2.out" },
                w.start,
              );
              tl.to(
                wordEl,
                { filter: "brightness(1)", duration: 0.16, ease: "power2.out" },
                w.start + 0.08,
              );
              tl.to(bgEl, { opacity: 0, scaleX: 1.02, duration: 0.1, ease: "power2.in" }, w.end);
              tl.set(bgEl, { scaleX: 0 }, w.end + 0.1);
            });
            tl.to(
              grp,
              { opacity: 0, duration: 0.1, ease: "power2.in" },
              Math.max(g.start, g.end - 0.1),
            );
            tl.set(grp, { opacity: 0, visibility: "hidden" }, g.end);
          });

          return tl;
        }

        var hfCurrentTimeline = null;

        function hfAttach(data) {
          var v = hfValidate(data);
          if (!v.ok) {
            hfRunGate([], 0, v.reason);
            return;
          }
          if (hfCurrentTimeline) {
            hfCurrentTimeline.kill();
            hfCurrentTimeline = null;
          }
          hfTeardown();
          var layout = hfApplyStageConfig(data, v.durationS);
          var tl = hfBuild(v.words, layout, v.durationS);
          tl.set({}, {}, v.durationS); // pin timeline length to the data-derived duration
          // GSAP quirk (confirmed 3.14.2): a fresh timeline already reports position 0,
          // so seek(0) is treated as a no-op and skips rendering .set() calls scheduled
          // at t=0 — the first frame would show pre-timeline CSS defaults (usually
          // hidden). render(time, suppressEvents, force) with force=true bypasses that.
          tl.render(0, true, true);
          hfCurrentTimeline = tl;
          window.__timelines = window.__timelines || {};
          window.__timelines[HF_COMPOSITION_ID] = tl;
          hfRunGate(v.words, v.durationS, null);
        }
        window.__HF_CAPTION_ATTACH__ = hfAttach;

        (function hfBoot() {
          function start(data) {
            var ready =
              document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
            ready.then(function () {
              // A manual window.__HF_CAPTION_ATTACH__ call that lands while the
              // sibling fetch / fonts.ready are still pending must win — never
              // clobber it with the late-arriving boot payload.
              if (hfCurrentTimeline) return;
              hfAttach(data);
            });
          }
          if (window.__HF_CAPTION__) {
            start(window.__HF_CAPTION__);
            return;
          }
          fetch("./caption-data.json")
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .catch(function () {
              return null;
            })
            .then(function (json) {
              start(json || HF_DEMO_DATA);
            });
        })();
      })();
    </script>

<style>
  /* El lienzo de este repo, y la raíz TRANSPARENTE: si el fondo llega opaco,
     omitBackground no lo recorta y los PNG salen sin alfa — el compositor
     los pega como un rectángulo y tapa el metraje. */
  html, body { width: 1080px; height: 1920px; margin: 0;
               background: transparent !important; overflow: hidden; }
  [data-composition-id="caption-highlight"] { transform-origin: 50% 50%; }
  /* El PLAFÓN DE AUTO-PREVISUALIZACIÓN. Varias piezas del catálogo traen un
     fondo propio para poder mirarse solas —hf-hw-callout-circle lo llama
     literalmente «self-preview scene» y es un degradado verde— y sobre
     nuestro metraje eso no es un fondo: es una mancha que tapa el plano.
     Se quita el relleno y se deja el contenido, que es lo que se quería. */
  [id$="-scene"] { background: none !important; }
</style>
<script>
(function () {
  var ID = "caption-highlight";
  var RANURAS = {};
  var raiz = document.querySelector('[data-composition-id="' + ID + '"]');
  var tl = (window.__timelines || {})[ID] || null;

     se centra. Es un APAÑO declarado, no una solución — la buena es rehacer
     la maqueta en vertical. config.encaje:false lo desactiva y
     config.escala lo fuerza.
     La medida sale de data-width/data-height y NO de offsetWidth: la raíz de
     varios bloques mide 0x0 —es un ancla para hijos posicionados, no una
     caja— y con la medida del DOM el encaje la mandaba a left:-420, fuera
     del cuadro. Fotograma transparente, cero errores, y el humo diciendo
     «no se mueve» porque no había nada que moviera. Por eso se envuelve en
     una caja del tamaño DECLARADO: así los hijos absolutos tienen un
     contenedor de verdad y la escala se aplica a algo con dimensiones. */
  var caja = null;
  function encaja(cfg) {
    if (!raiz || cfg.encaje === false) return;
    var w = +raiz.dataset.width || raiz.offsetWidth || 1920;
    var h = +raiz.dataset.height || raiz.offsetHeight || 1080;
    if (!caja) {
      caja = document.createElement('div');
      raiz.parentNode.insertBefore(caja, raiz);
      caja.appendChild(raiz);
    }
    caja.style.cssText = 'position:absolute;left:0;top:0;width:' + w
                       + 'px;height:' + h + 'px;transform-origin:0 0;';
    raiz.style.position = 'absolute';
    raiz.style.left = '0'; raiz.style.top = '0';
    raiz.style.width = w + 'px'; raiz.style.height = h + 'px';
    var k = cfg.escala || Math.min(1080 / w, 1920 / h);
    /* DÓNDE, y no solo cuánto. Centrado es lo razonable por defecto, pero un
       rótulo inferior centrado en un lienzo vertical queda en mitad de la
       cara; y §18 dice que la banda de abajo la pinta la app. zona mueve la
       caja ya escalada sin tocar la maqueta de dentro: arriba pega bajo la
       banda superior (230 px), abajo se apoya sobre la inferior (1459 px). */

     Sin anclas() una capa es invisible para el colocador: no sabe cuánto
     ocupa ni dónde, así que no puede apartarla del rostro ni avisar de que
     cae bajo el caption de la app. Nuestras plantillas la declaran a mano
     porque saben qué parte de sí mismas importa; un bloque importado no
     puede saberlo, así que se MIDE: unión de los rectángulos visibles, ya en
     coordenadas de lienzo —getBoundingClientRect incluye la transformación
     del encaje—, descartando los contenedores que cubren casi todo.
     Se llama después de seek, así que la caja es la del instante que se
     esté mirando y no la del reposo. */

       —si no, la caja de cualquier plantilla sería el lienzo entero y el dato
       no diría nada—. Pero en las de dibujo a mano el contenido ES un <svg> a
       pantalla completa y sus <path> devuelven cajas de cero: con el filtro
       puesto, veintisiete plantillas se quedaban sin ancla. Si la primera
       pasada no deja nada, se repite SIN filtro: una caja grande de más es
       peor que ninguna, pero ninguna es peor que las dos. */
    function une(filtra) {
      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      var todos = raiz.querySelectorAll('*');
      for (var i = 0; i < todos.length; i++) {
        var e = todos[i], s = getComputedStyle(e);
        if (s.display === 'none' || s.visibility === 'hidden' ||
            parseFloat(s.opacity) < 0.05) continue;
        var r = e.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) continue;
        if (filtra && r.width * r.height > 0.92 * 1080 * 1920) continue;
        if (r.left < x0) x0 = r.left;
        if (r.top < y0) y0 = r.top;
        if (r.right > x1) x1 = r.right;
        if (r.bottom > y1) y1 = r.bottom;
      }
      return x1 < x0 ? null : [x0, y0, x1, y1];
    }
    var c = une(true) || une(false);
    if (!c) return null;
    var x0 = c[0], y0 = c[1], x1 = c[2], y1 = c[3];
    x0 = Math.max(0, x0); y0 = Math.max(0, y0);
    x1 = Math.min(1080, x1); y1 = Math.min(1920, y1);
    return { bloque: { x: Math.round((x0 + x1) / 2), y: Math.round((y0 + y1) / 2),
                       w: Math.round(x1 - x0), h: Math.round(y1 - y0) } };
  }

  /* LA SALIDA, que sus bloques no tienen: entran y se quedan puestos hasta
     que la composición acaba. Aquí una capa vive dentro de su ventana y
     tiene que irse, y no es cosmética — es lo que humo_plantillas.js
     comprueba cuando muestrea tres instantes y exige que no sean el mismo
     fotograma. Medido: x-post y macos-notification animan su entrada y dan
     tres capturas idénticas después.
     Es una salida GENÉRICA —se va bajando y encogiendo un pelo— y por eso
     se puede apagar con config.salida:false cuando el bloque tenga la suya
     propia. Determinista: solo depende de t. */
  var SALIDA = 0.42;
  /* La duración del GESTO, medida al importar. La sustituye el importador;
     el valor de aquí es el de respaldo para quien abra el fichero suelto.
     Va en una variable y no en dos sitios a propósito: la salida tiene que
     caer dentro de la MISMA ventana que registra la plantilla, y cuando eran
     dos números —la declarada por la timeline y la registrada— la salida se
     programaba fuera del tramo que nadie llega a ver. */
  /* El copy que el plan pide, repartido por orden sobre las ranuras que
     declara TEXTOS. Lo que sobra se ignora; lo que falta se queda con lo que
     el bloque traía.
     Se aplica en CADA fotograma y no solo al montar, y no es por comodidad:
     varios bloques animan su propio texto —un contador que sube, un
     tecleado— así que su timeline reescribe el nodo en cada seek y el copy
     del plan duraba un fotograma. Medido: la tarjeta pedía «−12» y salía el
     «22» de la demo. */
  function copia(cfg) {
    for (var k in RANURAS) {
      if (!cfg || !cfg[k] || !cfg[k].length) continue;
      var nodos = document.querySelectorAll(RANURAS[k]);
      for (var i = 0; i < nodos.length && i < cfg[k].length; i++) {
        if (nodos[i].textContent !== cfg[k][i]) nodos[i].textContent = cfg[k][i];
      }
    }
  }

  var DUR = 7.80;   /* MEDIDO al importar */
  var vida = DUR;

  Engine.register({
    duration: DUR,
    /* Las ranuras se escriben LITERALES en los defaults, no con un
       Object.assign: lint_config.py lee ese bloque con una expresión regular
       —no ejecuta la plantilla— así que una clave calculada no existe para
       él y el plan que la usa aborta por «clave que la plantilla no lee».
       Las ranuras entran aquí porque lint_config.py --estricto
       comprueba que toda clave del plan la lea de verdad su plantilla: sin
       declararlas, pedir el copy por config es una clave muerta y el paso
       aborta. */
    defaults: { encaje: true, escala: null, zona: 'centro', salida: true,
                tema: 'carbon', cue: null, cueGain: null },
    setup: function (cfg) {
      encaja(cfg);
      vida = cfg.duration || DUR;
      copia(cfg);
      /* EL SONIDO: NINGUNO por defecto, y esto es una vuelta atrás.
         Se publicaba un «aparicion» genérico en cada bloque importado para
         que no entraran mudos. Sobre la pieza montada suena a lo que es: el
         mismo golpe blando en 126 sitios, puesto por una regla que no sabe
         qué está entrando. Un sonido que no significa nada es peor que el
         silencio, porque el oído lo cuenta igual.
         Quien sabe qué suena una capa es el guion —sfx en la capa— o la
         tabla del director para las plantillas que conoce. Con cue en la
         config se puede pedir uno a mano. */
      return { cues: (!cfg.sinSonido && cfg.cue)
                     ? [{ at: 0.04, sfx: cfg.cue, gain: cfg.cueGain || 0.5 }]
                     : [] };
    },
    anclas: function () { return tinta(); },
    /* El puente entero. Los dos motores hacen lo mismo —posicionar una
       animación en el segundo t, sin tocar el reloj del navegador—, así que
       no hay nada que traducir. */
    /* La salida va en la raíz y el encaje en la caja que la envuelve: dos
       transformaciones en dos nodos, para que no se pisen. */
    draw: function (t, cfg) {
      if (tl) tl.time(Math.max(0, Math.min(t, tl.duration())));
      copia(cfg);
      if (!raiz) return;
      if (cfg && cfg.salida !== false && vida > SALIDA) {
        var d = (t - (vida - SALIDA)) / SALIDA;
        if (d > 0) {
          var e = 1 - Math.min(1, d);
          e = e * e * (3 - 2 * e);              /* suavizado, sin rebote */
          raiz.style.opacity = e;
          raiz.style.transform = 'translateY(' + ((1 - e) * -26).toFixed(2)
                               + 'px) scale(' + (0.985 + 0.015 * e).toFixed(4) + ')';
          return;
        }
      }
      raiz.style.opacity = '';
      raiz.style.transform = '';
    }
  });
})();
</script>
