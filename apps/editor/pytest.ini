[pytest]
testpaths = tests
# El nivel por defecto es el RÁPIDO: sin navegador, sin ffmpeg y sin metraje.
# `render` y `lento` se piden a mano (`make render`, `make lento`), porque un
# arnés cuyo nivel por defecto tarda medio minuto se deja de ejecutar.
addopts = -m "not render and not lento"
markers =
    lento: cadena completa con material real
    render: necesita Playwright y un navegador
    ffmpeg: necesita el binario de ffmpeg
