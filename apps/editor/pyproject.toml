# Empaquetado IN SITU: los módulos de scripts/ se exponen como el paquete
# `editor` SIN mover un solo fichero. Es la fase 1 del traslado a un monorepo:
# otro repo podrá hacer `pip install -e .` sobre este y usar `import
# editor.reloj` / `editor.mezcla` / `editor.contratos` / `editor.comun` /
# `editor.escaleta`, mientras los ~20 scripts que hacen `sys.path.insert` e
# importan por nombre plano (`import reloj`) siguen funcionando exactamente
# igual — los dos mundos conviven, ver scripts/__init__.py.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editor-youtube"
version = "0.1.0"
description = "Pipeline determinista de edición vertical (1080x1920): Whisper local, motion graphics en Chromium y composición ffmpeg"
readme = "README.md"
# 3.12 EXACTO: MLX no publica ruedas para 3.14 y el repo está calibrado
# contra 3.12 (README, «Qué hace falta»).
requires-python = ">=3.12,<3.13"
license = { text = "Copyright (c) 2026. Todos los derechos reservados." }

# Sin dependencias base A PROPÓSITO: `editor.reloj`, `editor.mezcla`,
# `editor.contratos` y `editor.comun` son stdlib puro, y un consumidor que
# solo quiera el reloj (los tests compartidos de la fábrica, por ejemplo) no
# debe arrastrar mlx-whisper ni Playwright. El reparto vive en extras — la
# deuda de la Tanda 16, saldada en el monorepo (S2):
#
#   pip install -e .              → solo las librerías stdlib
#   pip install -e '.[pipeline]'  → producir un vídeo (STT, B-roll, rostro)
#   pip install -e '.[arnes]'     → correr make ci / make rapido
#
# requirements*.txt se mantienen como los lockfiles humanos que ya eran
# (make instalar los sigue usando); estos extras son su espejo declarativo
# para consumidores pip. Si divergen, mandan los requirements.
dependencies = []

[project.optional-dependencies]
pipeline = [
  "mlx-whisper>=0.4.0",
  "google-genai>=1.0.0",
  "pyobjc-framework-Vision>=10.0",
  "pyobjc-framework-Quartz>=10.0",
]
arnes = ["pytest>=8.0"]

[tool.setuptools]
# El mapeo que hace todo el trabajo: el paquete `editor` ES scripts/, sin
# mover ficheros ni romper los sys.path.insert existentes.
package-dir = { "editor" = "scripts" }
packages = ["editor"]
